  checked: 2026-10-06

# --- First scheduled review (October 2026, issue #2)
- url: https://github.com/MoguraMode/Psychoacoustic-Sound-Level-Meter
  reason: >-
    Sound level meter web app with simplified Zwicker loudness and Aures sharpness; the author states that it does
    not comply with ISO 532-1 and is not meant for precise measurement.
  checked: 2026-10-07
- url: https://github.com/neurobionics/uesl-protocol
