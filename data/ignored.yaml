- url: https://github.com/MForrest00/vassilakis_sra
  reason: Music dissonance model (Vassilakis).
  checked: 2026-10-06
- url: https://github.com/spectral-discord/dismal.js
  reason: Music dissonance models (Sethares, Vassilakis).
  checked: 2026-10-06
- url: https://github.com/bregmanstudio/BregmanToolkit
  reason: Music dissonance model (Sethares).
  checked: 2026-10-06
- url: https://github.com/TanUkkii007/BregmanToolkit
  reason: Copy of BregmanToolkit (Sethares dissonance).
  checked: 2026-10-06
- url: https://gist.github.com/endolith/3066664
  reason: Gist of the Sethares dissonance measure.
  checked: 2026-10-06
- url: https://github.com/soundspotter/consonance
