# --- Feature extractors whose loudness or sharpness does not follow a standardised model
- url: https://github.com/praat/praat
  reason: Its loudness sums phon-derived values over Bark bands; no named model or standard.
  checked: 2026-10-06
- url: https://github.com/audeering/opensmile
  reason: Loudness is an auditory-spectrum approximation for speech features, no named psychoacoustic model.
  checked: 2026-10-06
- url: https://github.com/jamiebullock/LibXtract
  reason: Music-information-retrieval descriptors (Bark-band loudness, Peeters-style sharpness), not the standardised models.
  checked: 2026-10-06
- url: https://github.com/nickjillings/js-xtract
  reason: JavaScript port of LibXtract descriptors, not the standardised models.
  checked: 2026-10-06
- url: https://github.com/meyda/meyda
  reason: Music-information-retrieval descriptors (Bark-band loudness, perceptual sharpness), not the standardised models.
  checked: 2026-10-06
- url: https://github.com/Yaafe/Yaafe
  reason: Peeters-style loudness and perceptual sharpness descriptors, not the standardised models.
  checked: 2026-10-06
- url: https://github.com/AudioCommons/timbral_models
  reason: Sharpness and roughness are inputs to timbre regressions; the README says it is unmaintained.
  checked: 2026-10-06
- url: https://github.com/cran/soundgen
  reason: Loudness, sharpness and roughness follow simplified non-standard models.
  checked: 2026-10-06
- url: https://github.com/supercollider/supercollider
  reason: The Loudness UGen describes itself as an informal Zwicker/Moore approximation.
  checked: 2026-10-06
- url: https://github.com/ppklose/ppkSPLMeter
  reason: Approximate loudness, sharpness, roughness and fluctuation strength without a stated model edition.
  checked: 2026-10-06
- url: https://github.com/CNMAT/CNMAT-Externs
  reason: Its loudness~ is spectral energy and its roughness external is a music dissonance model (Parncutt).
  checked: 2026-10-06

# --- Music sensory-dissonance models (roughness of musical intervals), out of scope
- url: https://github.com/supercollider/sc3-plugins
