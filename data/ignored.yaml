# Candidates that were reviewed and not included in the list, so that scripts/discover.py does not report
# them again (see data/SCHEMA.md). One entry per repository or package page; URLs are compared without
# "www.", trailing slash, ".git" or letter case, and a GitHub URL covers the whole repository.

# --- Wrappers, tutorials and tools without their own implementation
- url: https://github.com/ym1025-2/Sonemeter
  reason: >-
    Command-line wrapper that calls MoSQITo loudness_zwtv (two commits, not on PyPI); no implementation of its own.
    Wrappers are listed only when they are end-user applications or established libraries.
  checked: 2026-10-06
- url: https://github.com/mandip42/psychoacoustics-tutorial
  reason: Teaching code with simplified proxies (RMS "loudness", spectral-centroid "sharpness"), not the named models.
  checked: 2026-10-06
- url: https://github.com/hulacon/aud2psy
  reason: Wraps MoSQITo; its own fluctuation-strength estimate does not follow a named model.
  checked: 2026-10-06
- url: https://github.com/hyeonjoong/debussy
  reason: Wraps MoSQITo; no implementation of its own.
  checked: 2026-10-06
- url: https://github.com/wantysal/MoSQITooo
  reason: Fork of MoSQITo.
  checked: 2026-10-06
- url: https://github.com/IntersectAustralia/hcsvlab-psysound
  reason: 2013 copy of PsySound3 with a Galaxy wrapper; see PsySound3.
  checked: 2026-10-06
- url: https://github.com/jcdevaney/AMPACT
  reason: Music-performance tool that only calls the Genesis Loudness Toolbox.
  checked: 2026-10-06
- url: https://github.com/ntudsp/araus-dataset-baseline-models
  reason: Dataset code; loudness and sharpness values are precomputed columns, not an implementation.
  checked: 2026-10-06
- url: https://github.com/pyfar/pyfar
  reason: Acoustics library without psychoacoustic metrics.
  checked: 2026-10-06
- url: https://github.com/gnu-octave/octave-audio
  reason: Only phon/sone conversion, no loudness model.
  checked: 2026-10-06
- url: https://gist.github.com/chummersone/8499aa1dfe6955bd437c3a475cd17763
  reason: Short gist computing ISO 226:2003 contours; the same author's IoSR Matlab Toolbox is listed.
  checked: 2026-10-06
- url: https://gist.github.com/sammosummo/777debf946d0356acada
  reason: Short gist computing ISO 226 contours.
  checked: 2026-10-06
- url: https://github.com/jacobbaylesssmc/iso226
  reason: Two-commit extraction of the ISO 226 helper from PyDSM, which is listed.
  checked: 2026-10-06

