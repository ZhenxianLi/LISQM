title: Psychoacoustic Metrics Index
tagline: Open-source implementations of psychoacoustic metrics, by standard edition
description: >-
  An index of open-source implementations of psychoacoustic metrics (loudness, sharpness, roughness,
  fluctuation strength, tonality, impulsiveness and psychoacoustic annoyance), organised by the standard
  edition or model each implementation follows. All programming languages.
base_url: https://zhenxianli.github.io/psychoacoustic-metrics-index/
