      cfr-14-part-36: US regulation (Appendices A and B).

  - id: aural-detectability
    family: related
    name: Aural detectability
    title: Aural detectability of sounds in background noise
    aka: [detectability, d-prime, signal detection, aural detection, audibility of aircraft]
    unit: d′ (detectability index), dB
    summary: >-
      How likely a listener is to detect a sound in background noise, from signal-to-noise ratios in auditory
      filters and signal-detection theory. Used for aircraft, drone and urban air mobility noise. Not
      standardised.
    references: [fidell-1974, rizzi-2025]
    current: [fidell-1974]
    edition_notes:
      fidell-1974: Model paper.
      rizzi-2025: NASA's use of the model in annoyance assessments of urban air mobility, with audibility as a factor.
