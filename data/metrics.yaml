# Metric families and metrics. Each metric gets its own page; see data/SCHEMA.md.
# Metrics are listed in display order. `references` are chronological; `current` names the edition(s)
# an up-to-date implementation should follow.

families:
  - id: loudness
    name: Loudness
    summary: >-
      How loud a sound is perceived, in sone (loudness) and phon (loudness level). Four model families are
      standardised: Zwicker (ISO 532-1), Moore–Glasberg (ISO 532-2), Moore–Glasberg–Schlittenlacher
      (ISO 532-3) and the Sottek Hearing Model (ECMA-418-2).
  - id: sharpness
    name: Sharpness
    summary: >-
      The sensation produced by high-frequency content, in acum. Standardised in DIN 45692 on top of Zwicker
      loudness; ECMA-418-2 does not define sharpness.
  - id: roughness
    name: Roughness
    summary: >-
      The sensation produced by fast amplitude or frequency modulation (roughly 15 to 300 Hz, strongest near
      70 Hz), in asper.
  - id: fluctuation-strength
    name: Fluctuation strength
    summary: >-
      The sensation produced by slow modulation (below about 20 Hz, strongest near 4 Hz), in vacil.
  - id: tonality
    name: Tonality
    summary: >-
      How prominent tonal components are. Covers psychoacoustic tonality models (Aures, ECMA-418-2) and the
      engineering measures used for product noise (tone-to-noise ratio, prominence ratio) and for
      environmental noise (tonal audibility and tone adjustments).
  - id: impulsiveness
    name: Impulsiveness
    summary: >-
      How prominent impulsive sounds are, and the adjustment applied to them in environmental noise
      assessment.
  - id: annoyance
    name: Psychoacoustic annoyance
    summary: >-
      Single-number models that combine loudness, sharpness, roughness, fluctuation strength and, in later
      models, tonality into a predicted annoyance.
  - id: related
    name: Related quantities
    summary: >-
      Quantities that psychoacoustic tools often include and that are closely tied to the metrics above.

metrics:
  # ------------------------------------------------------------------------------------------- loudness
  - id: loudness-zwicker
    family: loudness
    name: Zwicker loudness
    title: Zwicker loudness (ISO 532-1, DIN 45631)
    aka: [ISO 532-1, ISO 532B, ISO 532 method B, DIN 45631, DIN 45631/A1, Zwicker method]
    unit: sone, phon
    summary: >-
      Loudness from Zwicker's model: third-octave band levels are turned into specific loudness on the
      critical-band (Bark) scale and integrated. ISO 532-1:2017 specifies one procedure for stationary sounds
      and one for time-varying sounds (from which percentile values are taken, such as N5, the loudness exceeded
      5 % of the time), and replaced method B of ISO 532:1975. The German standards DIN 45631 (stationary) and DIN 45631/A1 (time-varying)
      specify Zwicker's method; ISO 532-1:2017 states that its stationary method is based on DIN 45631:1991.
    notes: >-
      In China, GB/T 25982-2024 (interior noise of buses, in force since July 2025) sets loudness and sharpness
      limits and gives Zwicker's calculation in an informative annex.
    references: [iso-532-1975, din-45631-1991, chalupper-fastl-2002, din-45631-a1-2010, iso-532-1-2017, iso-532-1-ed2-draft]
    current: [iso-532-1-2017]
    conventions:
      - >-
        **Sound field.** ISO 532-1 has a free-field and a diffuse-field version, which give different values for the
        same signal. Most implementations use free field unless told otherwise.
      - >-
        **Calibration.** The input is sound pressure in pascals. Audio read from a file has to be scaled first, and
        tools ask for this in different ways: a calibration factor, a reference level or a full-scale level.
      - >-
        **Sample rate.** The time-varying method is specified at 48 kHz. Some implementations reject other rates,
        others resample them, and the resampler changes the result slightly.
      - >-
        **Percentiles.** N5, the loudness exceeded 5 % of the time, depends on how the percentile is taken: SQAT
        picks the nearest rank, while MATLAB's `prctile` and the NumPy and Julia quantile functions interpolate,
        each in its own way.
      - >-
        **Start of the signal.** Time-varying loudness starts from silence and needs time to settle. Whether the
        start is left out of N5 and other statistics (`time_skip` in SQAT, `time_skip_s` in MetaSona) matters for
        short signals.
    edition_notes:
      iso-532-1975: Method B (Zwicker) for stationary sounds, from third-octave levels.
      din-45631-1991: Stationary sounds.
      chalupper-fastl-2002: Dynamic loudness model built on Zwicker's model, also for hearing impairment (not standardised).
      din-45631-a1-2010: Adds the procedure for time-varying sounds.
      iso-532-1-2017: Stationary and time-varying procedures; Annex A reference program, Annex B test signals.
      iso-532-1-ed2-draft: Second edition at committee-draft stage since November 2024.
    see_also: [sharpness, loudness-ecma-418-2]

  - id: loudness-moore-glasberg
    family: loudness
    name: Moore–Glasberg loudness
    title: Moore–Glasberg loudness of stationary sounds (ISO 532-2, ANSI S3.4)
    aka: [ISO 532-2, ANSI S3.4, ANSI/ASA S3.4-2007, Moore-Glasberg method, Cambridge loudness model]
    unit: sone, phon
    summary: >-
      Loudness of stationary sounds from the Moore–Glasberg model: the spectrum is turned into an excitation
      pattern on the ERB-number scale, then into specific loudness, which is summed. ANSI S3.4-2007
      standardised the model of Moore, Glasberg & Baer (1997) with later modifications; ISO 532-2:2017
      specifies the method for monaural and binaural listening.
    references: [moore-1997, ansi-s3-4-2007, chen-2011, iso-532-2-2017, iso-532-2-ed2-draft]
    current: [iso-532-2-2017]
    edition_notes:
      moore-1997: Model paper (thresholds, loudness and partial loudness).
      ansi-s3-4-2007: American standard based on the 1997 model with later modifications.
      chen-2011: Faster excitation-pattern calculation, also for hearing loss (not standardised).
      iso-532-2-2017: Monaural and binaural loudness of stationary sounds; source code supplied with the standard.
      iso-532-2-ed2-draft: Second edition at committee-draft stage since November 2024.
    see_also: [loudness-moore-glasberg-time-varying]

  - id: loudness-moore-glasberg-time-varying
    family: loudness
    name: Time-varying loudness (Moore–Glasberg–Schlittenlacher)
    title: Time-varying loudness, Moore–Glasberg–Schlittenlacher (ISO 532-3)
    aka: [ISO 532-3, TVL, time-varying loudness, Glasberg and Moore 2002, Moore-Glasberg-Schlittenlacher method,
          short-term loudness, long-term loudness]
    unit: sone, phon
    summary: >-
      Loudness of time-varying sounds as instantaneous, short-term and long-term loudness. It starts from the
      Glasberg & Moore (2002) model; Moore et al. (2016) added binaural inhibition and Moore et al. (2018)
      revised the time constants. ISO 532-3:2023 standardises the resulting Moore–Glasberg–Schlittenlacher
      method for stationary and time-varying sounds.
    references: [glasberg-moore-2002, moore-2016, moore-2018, iso-532-3-2023, iso-532-3-ed2-draft]
    current: [iso-532-3-2023]
    conventions:
      - >-
        **Sample rate.** The Cambridge programs and ISO 532-3 work at 32 kHz. Most implementations resample to it;
        phonometry runs at the native rate (a documented deviation), and the Swift & Gee code and the HAW tool expect
        32 kHz input.
      - >-
        **Which output.** The models give instantaneous, short-term and long-term loudness; compare like with like.
    edition_notes:
      glasberg-moore-2002: Time-varying loudness model (short-term and long-term loudness).
      moore-2016: Adds binaural inhibition.
      moore-2018: Revised time constants.
      iso-532-3-2023: Standardised method; source code supplied with the standard.
      iso-532-3-ed2-draft: Second edition at committee-draft stage since November 2024.
    see_also: [loudness-moore-glasberg]

  - id: loudness-ecma-418-2
    family: loudness
    name: Sottek Hearing Model loudness
    title: Loudness from the Sottek Hearing Model (ECMA-418-2)
    aka: [ECMA-418-2 loudness, Sottek Hearing Model, SHM loudness, sone_HMS, hearing model loudness]
    unit: sone_HMS
    summary: >-
      Loudness from the Sottek Hearing Model defined in ECMA-418-2. The hearing model (Clause 5) produces
      specific loudness; the 2nd edition (2022) added a loudness calculation for sounds with tonal and noise
      components (Clause 8). ECMA-418-2 has had four editions in five years, so implementations of different
      editions can disagree.
    references: [ecma-418-2-ed1, ecma-418-2-ed2, ecma-418-2-ed3, ecma-418-2-ed4]
    current: [ecma-418-2-ed4]
    conventions:
      - >-
        **Edition.** The four editions give different results; compare implementations of the same edition (see the
        table of editions).
      - >-
        **Which loudness.** Clause 5 gives the hearing model's basic loudness; from the 2nd edition on, Clause 8
        defines the loudness to report. MoSQITo and Mosqito.NET compute only the Clause 5 value, while the RefMap
        code and its ports (SQAT, sottek-hearing-model, MetaSona) compute the Clause 8 loudness.
      - >-
        **Start of the signal.** The filters need time to settle, so overall values leave out the first 304 ms
        (Section 8.1.4 of the 2025 edition, as cited by SQAT, which enforces it).
      - >-
        **Sample rate.** The model is defined at 48 kHz; other rates are resampled, and resamplers differ slightly.
      - >-
        **Sound field and channels.** The outer- and middle-ear filter can be free frontal or, from the 3rd edition,
        diffuse, and two channels can be combined into one binaural value. Check both settings.
    edition_notes:
      ecma-418-2-ed1: Hearing model (Clause 5) with specific loudness.
      ecma-418-2-ed2: New Clause 8, loudness of sounds with subcritical or wider bandwidth.
      ecma-418-2-ed3: Adds a diffuse-field outer and middle ear filter.
      ecma-418-2-ed4: Hearing-model clauses 5.1.2.2 and 5.1.5.2 revised; conformance requires 48 kHz sampling.
    see_also: [loudness-zwicker, tonality-ecma-418-2, roughness-ecma-418-2, fluctuation-strength-ecma-418-2]

  # ------------------------------------------------------------------------------------------- sharpness
  - id: sharpness
    family: sharpness
    name: Sharpness
    title: Sharpness (DIN 45692, Aures, von Bismarck)
    aka: [DIN 45692, acum, Zwicker sharpness, Aures sharpness, von Bismarck sharpness]
    unit: acum
    summary: >-
      Sharpness is the weighted first moment of specific loudness along the critical-band rate, with a
      weighting that emphasises high frequencies. DIN 45692:2009 standardises the weighting and a test
      procedure, using Zwicker specific loudness (ISO 532-1 / DIN 45631). Most implementations also offer the
      weightings of von Bismarck (1974) and Aures (1985).
    references: [von-bismarck-1974, aures-1985-euphony, fastl-zwicker-2007, din-45692-2009, swift-gee-2017]
    current: [din-45692-2009]
    conventions:
      - >-
        **Weighting.** The DIN 45692, Aures and von Bismarck weightings give different values for the same sound,
        and Aures' weighting depends on loudness. Many tools offer several; check which one is used (RefMap's
        default is Aures).
      - >-
        **Loudness input.** Sharpness is computed from Zwicker specific loudness, so the loudness choices (sound
        field, calibration, sample rate) carry over. Sharpness from another loudness model, such as ECMA-418-2
        (RefMap) or Moore–Glasberg (Swift & Gee), is a different quantity.
    edition_notes:
      von-bismarck-1974: Original sharpness weighting.
      aures-1985-euphony: Weighting that depends on total loudness.
      fastl-zwicker-2007: Zwicker & Fastl weighting as given in the textbook.
      din-45692-2009: Standardised weighting and test procedure; no revision announced.
    see_also: [loudness-zwicker]

  # ------------------------------------------------------------------------------------------- roughness
  - id: roughness-daniel-weber
    family: roughness
    name: Roughness (Daniel & Weber)
    title: Roughness, Daniel & Weber model
    aka: [Daniel and Weber roughness, Daniel & Weber 1997, Aures roughness, asper]
    unit: asper
    summary: >-
      Roughness from the model of Daniel & Weber (1997), an optimised version of Aures's (1985) model. It is
      not standardised, and the paper leaves details open (filter bank, calibration, framing), so
      implementations can give different values for the same signal.
    notes: >-
      SQAT rewrote its implementation in September 2026 (PR #65). It builds on Alejandro Osses's code and was
      corrected against revised code that Dik Hermes provided in 2025, which changes results compared with SQAT
      v1.3 and earlier.
    references: [aures-1985-roughness, daniel-weber-1997]
    current: [daniel-weber-1997]
    conventions:
      - >-
        **Frames.** The model works on 200 ms frames. Implementations differ in the hop between frames and in
        whether the last complete frame is reported, which changes time series and their percentiles.
      - >-
        **Code lineage.** SQAT's code (after Dik Hermes) and MoSQITo's differ in details, and ports follow one or
        the other; PsychoacousticMetrics.jl, which follows MoSQITo, says the two place the weighting g(z_i)
        differently.
      - >-
        **Version.** SQAT rewrote its roughness on `main` in September 2026, so SQAT v1.3, `main` and code ported
        from either give different values.
    edition_notes:
      aures-1985-roughness: Earlier model that Daniel & Weber optimised.
      daniel-weber-1997: Reference model.
    see_also: [roughness-ecma-418-2]

  - id: roughness-ecma-418-2
    family: roughness
    name: Sottek Hearing Model roughness
    title: Roughness from the Sottek Hearing Model (ECMA-418-2)
    aka: [ECMA-418-2 roughness, asper_HMS, Sottek roughness, SHM roughness]
    unit: asper_HMS
    summary: >-
      Roughness from the Sottek Hearing Model, Clause 7 of ECMA-418-2. The 2nd edition (2022) added an
      optional entropy weighting for cases where rotational speed is measured; the 3rd edition (2024) adapted
      zero-padding and segmentation, and its refinements were mainly to roughness.
    references: [ecma-418-2-ed1, ecma-418-2-ed2, ecma-418-2-ed3, ecma-418-2-ed4]
    current: [ecma-418-2-ed4]
    conventions:
      - >-
        **Edition.** Compare implementations of the same edition: MoSQITo, Mosqito.NET and tools that call MoSQITo
        follow the 2nd edition, the others the 3rd or 4th.
      - >-
        **Overall value.** The single value is the 90th percentile of the time-dependent roughness after the first
        320 ms. NumPy's percentile (sottek-hearing-model) and MATLAB's `prctile` (RefMap, SQAT) interpolate
        differently, so single values can differ slightly.
      - >-
        **Calibration and time grid.** SQAT uses a slightly adjusted calibration factor and a time grid that ends at
        the signal duration; MetaSona uses the standard's nominal factor (0.0180685) and its 20 ms grid.
      - >-
        **Binaural.** Two channels can be combined into one binaural value; per-channel and combined values differ.
    edition_notes:
      ecma-418-2-ed1: Clause 7 roughness.
      ecma-418-2-ed2: Refined calculation; optional entropy-weighted roughness.
      ecma-418-2-ed3: Zero-padding and segmentation adapted; refinements mainly to roughness.
      ecma-418-2-ed4: Hearing-model and conformance updates (48 kHz sampling).
    see_also: [roughness-daniel-weber, loudness-ecma-418-2]

  - id: roughness-din-38455
    family: roughness
    name: Roughness (DIN 38455)
    title: Roughness, DIN 38455
    aka: [DIN 38455, Rauigkeit, German roughness standard]
    unit: asper
    summary: >-
      DIN 38455:2024 is the first German standard for calculating roughness. Its text is not freely
      available, and the model it specifies could not be confirmed from public sources; a hearing-model
      roughness was proposed for DIN standardisation by Sottek & Becker (2019).
    references: [din-38455-2024]
    current: [din-38455-2024]
    edition_notes:
      din-38455-2024: First edition.
    see_also: [roughness-ecma-418-2, roughness-daniel-weber]

  # ------------------------------------------------------------------------------- fluctuation strength
  - id: fluctuation-strength-osses
    family: fluctuation-strength
    name: Fluctuation strength (Osses et al.)
    title: Fluctuation strength, Osses et al. model and Fastl & Zwicker formula
    aka: [fluctuation strength, vacil, Osses 2016, Fastl and Zwicker fluctuation strength]
    unit: vacil
    summary: >-
      Fluctuation strength describes slow modulation around 4 Hz. Osses, García & Kohlrausch (2016) proposed
      a signal-based model; Fastl & Zwicker give a closed-form expression for modulated tones and noises.
      Neither is standardised. ECMA-418-2:2025 added a hearing-model method, listed on its own page.
    references: [fastl-zwicker-2007, osses-2016]
    current: [osses-2016]
    conventions:
      - >-
        **Sample rate.** The model's envelope filters exist for 44.1 and 48 kHz: SQAT resamples other rates,
        PsychoacousticMetrics.jl rejects them.
      - >-
        **Steady sounds.** The model is meant for modulated sounds; a steady tone does not give exactly zero
        (phonometry reports about 0.09 vacil for a 1 kHz tone).
    edition_notes:
      fastl-zwicker-2007: Closed-form expression for amplitude- and frequency-modulated sounds.
      osses-2016: Signal-based model.
    see_also: [fluctuation-strength-ecma-418-2]

  - id: fluctuation-strength-ecma-418-2
    family: fluctuation-strength
    name: Sottek Hearing Model fluctuation strength
    title: Fluctuation strength from the Sottek Hearing Model (ECMA-418-2)
    aka: [ECMA-418-2 fluctuation strength, vacil_HMS, Sottek fluctuation strength]
    unit: vacil_HMS
    summary: >-
      Fluctuation strength from the Sottek Hearing Model, new in the 4th edition of ECMA-418-2 (June 2025,
      Clause 9). It uses high-resolution spectral analysis for modulation rates of about 0.25 to 20 Hz.
    references: [ecma-418-2-ed4]
    current: [ecma-418-2-ed4]
    conventions:
      - >-
        **Overall value.** The single value is a 90th percentile of the time-dependent values after the filters have
        settled. NumPy (sottek-hearing-model) and MATLAB's `prctile` interpolate differently, by at most 0.0005
        vacil_HMS on sottek-hearing-model's test signals.
      - >-
        **Interpretation.** Implementers report misprints and open questions in Clause 9 of the 2025 edition
        (phonometry's errata, sottek-hearing-model's documented departures), so implementations can differ until
        they are resolved.
    edition_notes:
      ecma-418-2-ed4: New Clause 9.
    see_also: [fluctuation-strength-osses, loudness-ecma-418-2]

  # ------------------------------------------------------------------------------------------- tonality
  - id: tonality-aures
    family: tonality
    name: Tonality (Aures)
    title: Tonality, Aures/Terhardt model
    aka: [Aures tonality, Terhardt tonality, tonality units, t.u., sensory euphony]
    unit: t.u.
    summary: >-
      Tonality from Aures (1985): tonal components are extracted with the method of Terhardt, Stoll & Seewann
      (1982), weighted, and related to the loudness of the whole sound. Not standardised.
    notes: >-
      SQAT corrected several issues in September 2026 (for example, the level excess of only one tonal
      component, the last positive one, entered the result, combined with the first component's frequency and
      bandwidth), which changes results compared with SQAT v1.3 and earlier.
    references: [terhardt-1982, aures-1985-euphony]
    current: [aures-1985-euphony]
    edition_notes:
      terhardt-1982: Extraction of tonal components used by the model.
      aures-1985-euphony: Tonality model.
    see_also: [tonality-ecma-418-2]

  - id: tonality-ecma-418-2
    family: tonality
    name: Sottek Hearing Model tonality
    title: Tonality from the Sottek Hearing Model (ECMA-418-2)
    aka: [ECMA-418-2 tonality, psychoacoustic tonality, tu_HMS, Sottek tonality, SHM tonality]
    unit: tu_HMS
    summary: >-
      Psychoacoustic tonality from the Sottek Hearing Model, Clause 6 of ECMA-418-2, with specific tonality
      and tonal frequency over time. The method came from ECMA-74 (17th edition, 2019) when ECMA-418-2 was
      first published in 2020.
    references: [ecma-74-ed17, ecma-418-2-ed1, ecma-418-2-ed2, ecma-418-2-ed3, ecma-418-2-ed4]
    current: [ecma-418-2-ed4]
    conventions:
      - >-
        **Edition and start.** Compare implementations of the same edition; overall values leave out the first
        304 ms, where the filters settle.
      - >-
        **Tonal annoyance weighting.** RefMap and sottek-hearing-model offer an optional weighting after Sottek &
        Becker (2019), which is not part of ECMA-418-2; leave it off when comparing with other implementations.
    edition_notes:
      ecma-74-ed17: Hearing model and tonality before ECMA-418-2 existed.
      ecma-418-2-ed1: Clause 6 tonality.
      ecma-418-2-ed2: Refined calculation.
      ecma-418-2-ed3: Diffuse-field outer and middle ear filter added (affects all metrics); refinements mainly to roughness.
      ecma-418-2-ed4: Hearing-model and conformance updates (48 kHz sampling).
    see_also: [tonality-aures, tone-to-noise-prominence-ratio, loudness-ecma-418-2]

  - id: tone-to-noise-prominence-ratio
    family: tonality
    name: Tone-to-noise ratio and prominence ratio
    title: Tone-to-noise ratio and prominence ratio (ECMA-418-1)
    aka: [TNR, PR, ECMA-418-1, ECMA-74 Annex D, prominent discrete tones, ANSI S1.13 Annex]
    unit: dB
    summary: >-
      Tone-to-noise ratio (TNR) and prominence ratio (PR) decide whether a discrete tone is prominent: TNR
      compares the tone with the noise in its critical band, PR compares the critical band with its
      neighbours. ECMA-418-1 took the method over from Annex D of ECMA-74 in 2020; its 3rd edition (2024)
      revised the TNR procedure.
    references: [ecma-74-ed17, ecma-418-1-ed1, ecma-418-1-ed2, ecma-418-1-ed3]
    current: [ecma-418-1-ed3]
    edition_notes:
      ecma-74-ed17: Annex D, before ECMA-418-1 existed.
      ecma-418-1-ed1: Based on, and mostly identical to, ECMA-74 Annex D.
      ecma-418-1-ed2: Maximum tone bandwidth for TNR set to 15 % of the critical band; corrections.
      ecma-418-1-ed3: TNR procedure revised for repeatable results across FFT resolutions; terms rewritten.
    see_also: [tonality-ecma-418-2, tonal-audibility-iso-20065]

  - id: tonality-din-45681
    family: tonality
    name: Tonal components (DIN 45681)
    title: Tonal components and tone adjustment (DIN 45681)
    aka: [DIN 45681, tone adjustment, K_T, Tonzuschlag]
    unit: dB
    summary: >-
      German method that detects tonal components in noise from narrow-band spectra and derives a tone
      adjustment for the assessment of noise immissions. DIN 45681:2005, corrected by Berichtigung 2:2006-08
      (which replaced Berichtigung 1:2005-08), is current.
    references: [din-45681-2002-draft, din-45681-2005]
    current: [din-45681-2005]
    edition_notes:
      din-45681-2005: Current; Berichtigung 2:2006-08 replaced Berichtigung 1:2005-08.
    see_also: [tonal-audibility-iso-20065]

  - id: tonal-audibility-iso-20065
    family: tonality
    name: Audibility of tones in noise (ISO/TS 20065)
    title: Audibility of tones in noise (ISO/TS 20065)
    aka: [ISO/TS 20065, ISO/PAS 20065, tonal audibility, decisive audibility, ΔL_ta]
    unit: dB
    summary: >-
      Engineering method for the audibility of tones in noise, from critical-band analysis of narrow-band
      spectra. First published as ISO/PAS 20065:2016 and turned into ISO/TS 20065:2022, which notes that the
      method is not validated below 50 Hz.
    references: [iso-pas-20065-2016, iso-ts-20065-2022]
    current: [iso-ts-20065-2022]
    edition_notes:
      iso-pas-20065-2016: Publicly available specification; withdrawn in 2022.
      iso-ts-20065-2022: Technical specification; adds that the method is not validated below 50 Hz.
    see_also: [tonality-din-45681, tonal-audibility-iso-1996-2]

  - id: tonal-audibility-iso-1996-2
    family: tonality
    name: Tonal audibility (ISO 1996-2)
    title: Tonal audibility in environmental noise (ISO 1996-2)
    aka: [ISO 1996-2 Annex C, ISO 1996-2 Annex J, ISO 1996-2 Annex K, tonal adjustment, environmental noise tonality]
    unit: dB
    summary: >-
      Objective tonal audibility and tone adjustment for environmental noise assessment. ISO 1996-2:2007 gave
      a method in Annex C; ISO 1996-2:2017 replaced it with an engineering method (Annex J) and a survey
      method (Annex K).
    references: [iso-1996-2-2007, iso-1996-2-2017]
    current: [iso-1996-2-2017]
    edition_notes:
      iso-1996-2-2007: Annex C tonal audibility.
      iso-1996-2-2017: Annex J engineering method and Annex K survey method.
    see_also: [tonal-audibility-iso-20065, tonal-audibility-iec-61400-11]

  - id: tonal-audibility-iec-61400-11
    family: tonality
    name: Tonal audibility of wind turbines (IEC 61400-11)
    title: Tonal audibility of wind turbine noise (IEC 61400-11)
    aka: [IEC 61400-11, wind turbine tonality, tonal audibility]
    unit: dB
    summary: >-
      Tonality analysis in the acoustic noise measurement of wind turbines: tones are identified in
      narrow-band spectra and their tonal audibility is reported.
    references: [iec-61400-11-2002, iec-61400-11-2012]
    current: [iec-61400-11-2012]
    edition_notes:
      iec-61400-11-2002: Edition 2 (Amendment 1 in 2006); already has a tonal audibility procedure.
      iec-61400-11-2012: Edition 3 with Amendment 1 (2018); tonal audibility in clause 9.5.
    see_also: [tonal-audibility-iso-1996-2]

