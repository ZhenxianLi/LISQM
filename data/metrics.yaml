  # ----------------------------------------------------------------------------------------- annoyance
  - id: psychoacoustic-annoyance
    family: annoyance
    name: Psychoacoustic annoyance
    title: Psychoacoustic annoyance (Widmann, Zwicker & Fastl, More, Di et al.)
    aka: [PA, psychoacoustic annoyance, Zwicker annoyance, Widmann annoyance, More annoyance, Di annoyance]
    unit: dimensionless
    summary: >-
      Psychoacoustic annoyance (PA) combines percentile loudness N5 with sharpness, roughness and fluctuation
      strength (Widmann 1992; Zwicker & Fastl 1999). More (2010) added tonality and Di et al. (2016) adapted
      the model for tonal noise. None of these is standardised; ISO/AWI 26573, registered in 2026, covers the
      assessment of annoyance through listening tests, including prediction models.
    references: [widmann-1992, zwicker-fastl-1999, more-2010, di-2016, iso-26573-draft]
    current: [widmann-1992, zwicker-fastl-1999, more-2010, di-2016]
    conventions:
      - >-
        **Inputs.** The models combine percentile values of loudness, sharpness, roughness and fluctuation strength
        (N5, S5, R5 and F5 in SQAT and PsychoacousticMetrics.jl). The percentile definition and the sharpness,
        roughness and fluctuation-strength models used change the result, and so does using whole-signal values
        instead (a stationary approximation).
      - >-
        **Same model, two names.** Zwicker & Fastl (1999) give Widmann's (1992) model; SQAT lists it under both
        names. More (2010) and Di et al. (2016) are different models.
    edition_notes:
      widmann-1992: Original model.
      zwicker-fastl-1999: Book version of the model.
      more-2010: Adds tonality.
      di-2016: Adapted for tonal noise.
      iso-26573-draft: Approved work item (stage 20.00) since 2026.

