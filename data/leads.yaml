- name: Genesis Loudness Toolbox
  url: http://www.genesis-acoustics.com/index.php?page=32
  languages: [MATLAB]
  claim: >-
    Free MATLAB toolbox (2010) said to cover ISO 532B / DIN 45631, ANSI S3.4-2007, Zwicker's time-varying model,
    Glasberg & Moore (2002) and Boullet's (2006) loudness model for impulsive sounds.
  why: >-
    An [archived copy](https://web.archive.org/web/20150306205824/http://genesis-acoustics.com/index.php?page=32) of
    the page (2015) says the ZIP file contains MATLAB source files, validation WAV files and a Readme with the terms
    of use, but the download page was not archived and the website could not be reached, so the code and its
    licence could not be checked.
  checked: 2026-10-07

