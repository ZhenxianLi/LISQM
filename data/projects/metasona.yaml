id: metasona
name: MetaSona
repository: https://github.com/huaaudio/metasona
docs: https://github.com/huaaudio/metasona/tree/main/docs
languages: [C, Python]
kind: library
based_on: sqat
language_note: >-
  A CMake library in C11 with the header `metasona/metasona.h` and a documented C API. The Python package
  loads the compiled library with ctypes and ships prebuilt wheels for Windows x64, Linux x64 and ARM64 and
  macOS (Intel and Apple silicon), for Python 3.9 to 3.14. The C functions take 48 kHz input; the Python
  interface resamples.
standing: newly-released
standing_note: First released in September 2026.
rank: 1  # first among the newly released projects
license: GPL-3.0-only AND Apache-2.0 AND BSD-3-Clause AND MIT
license_note: >-
  The combined distribution is GPL-3.0. MetaSona's own code is Apache-2.0; the ECMA-418-2 kernels (from
  SQAT/RefMap) and the current Aures tonality port are GPL-3.0; SQAT's ISO 532-1 filtering (BSD-3-Clause),
  SQAT's Daniel & Weber roughness (MIT), MoSQITo data (Apache-2.0) and PocketFFT (BSD-3-Clause) keep their
  notices.
packages:
  - registry: pypi
    name: metasona
install: pip install metasona
maintainers: [Jiahua Zhang]
summary: >-
  C library with a typed Python interface and prebuilt wheels, written to make repeated psychoacoustic
  analysis fast. Covers Zwicker loudness, DIN 45692 sharpness, Daniel–Weber roughness, Aures tonality and
  ECMA-418-2:2025 loudness, roughness and tonality.
ai_assistance: disclosed
ai_note: README and NOTICE state that it was developed with assistance from OpenAI Codex.
notes:
  - First commit and first PyPI release on 2026-09-16.
  - >-
    Ports SQAT revision `e6228b78` (2026-09-15), which includes the Daniel & Weber rewrite (#65) and the Aures
    tonality fixes (#66–#73) but not PR #77 (2026-09-17), a fix to the Terhardt filter bank that Daniel & Weber
    roughness uses. Model data come from MoSQITo; differences to both are listed in
    [THIRD_PARTY.md](https://github.com/huaaudio/metasona/blob/main/THIRD_PARTY.md).
  - The README reports speed-ups over MoSQITo 1.2.1 (e.g. 73× for time-varying loudness on its benchmark signal).
conventions:
  - Expects calibrated sound pressure in pascals.
  - >-
    The C functions require 48 kHz input; the Python interface resamples other rates to 48 kHz (SciPy
    `resample_poly`).
  - >-
    `time_skip_s` (default 0 s) leaves out the start of the signal from the reported frames; the computation still
    runs over the whole signal. Time-varying results include every complete frame, labelled at frame centres, which
    differs from SQAT's handling of the last frame and of time stamps.
caveats:
  - Very new (first released in September 2026) and not yet seen to be widely used in the community; no independent verification has been published.
  - The README calls the current version experimental, particularly roughness and tonality, and says standards conformance has not been established.
  - >-
    Comparisons with SQAT and MoSQITo are described as kept outside the package repository, and the
    third-party notes say exact agreement with the MATLAB code is not established.
ported_from:
  - source: mosqito
    credit: >-
      [`THIRD_PARTY.md`](https://github.com/huaaudio/metasona/blob/main/THIRD_PARTY.md) and
      [`NOTICE`](https://github.com/huaaudio/metasona/blob/main/NOTICE) credit "Eomys and the MoSQITo contributors",
      name the MoSQITo revision used (`d990c33`) and its Apache-2.0 licence, and list the upstream files its model
      data come from.
    checked: 2026-10-08
  - source: sqat
    license: GPL-3.0-or-later, from the main branch, with BSD-3-Clause and MIT parts
    credit: >-
      [`NOTICE`](https://github.com/huaaudio/metasona/blob/main/NOTICE) and
      [`THIRD_PARTY.md`](https://github.com/huaaudio/metasona/blob/main/THIRD_PARTY.md) name the SQAT revision used
      (`e6228b7`), the authors of each adapted part (Mike Lotinga and Matt Torjussen for the ECMA-418-2 kernels; Ella
      Manor, Gil Felix Greco and Sergio Aguirre for ISO 532-1 loudness; Dik Hermes and others for Daniel & Weber
      roughness; Gil Felix Greco and Sergio Aguirre for Aures tonality) and the licence each part keeps.
    checked: 2026-10-08
implements:
  - method: loudness-zwicker
    reference: iso-532-1-2017
    functions: [stationary_loudness, time_varying_loudness, loudness_from_levels]
    scope: stationary and time-varying; also from 28 third-octave levels
    status: available
    since: 0.1.0
    validation: cross-implementation
    compared_with: [mosqito]
    derived_from: [mosqito, sqat]
    validation_details:
      - >-
        Model tables taken from MoSQITo were checked element by element; one upper-slope value (0.22) follows the ISO
        532-1 reference C table where MoSQITo uses 0.24.
      - >-
        The project says that detailed validation and reference comparisons are kept outside the repository; the
        results are not published. The README says standards conformance has not been established.
  - method: sharpness
    reference: din-45692-2009
    functions: [sharpness_din45692]
    scope: from specific loudness
    status: available
    since: 0.1.0
    validation: not-stated
  - method: roughness-daniel-weber
    reference: daniel-weber-1997
    functions: [roughness_daniel_weber]
    status: available
    since: 0.1.0
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - >-
        The project says that detailed validation and reference comparisons are kept outside the repository; the
        results are not published.
      - The API documentation calls the function experimental and says normative validation remains open.
    note: >-
      Follows SQAT revision `e6228b78`, which includes SQAT's September 2026 rewrite but not its later fix to the
      Terhardt filter bank (PR #77).
  - method: tonality-aures
    reference: aures-1985-euphony
    functions: [tonality_aures]
    status: available
    since: 0.1.0
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - >-
        The project calls its source-based Python comparisons "development checks, not an executed MATLAB/Octave
        validation"; exact agreement with MATLAB is not established.
      - The results are not published.
    note: Follows SQAT's September 2026 revision (250 ms Hann windows, 125 ms hop).
  - method: loudness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [loudness_ecma, ecma_tonal_analysis]
    scope: Clause 8 loudness with tonal/noise separation; mono or stereo
    status: available
    since: 0.2.0
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - >-
        The project says that detailed validation and reference comparisons are kept outside the repository; the
        results are not published.
    note: Adapted from the SQAT/RefMap MATLAB code by Lotinga and Torjussen.
  - method: roughness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [roughness_ecma]
    scope: mono or stereo; optional entropy weighting not applied
    status: available
    since: 0.2.0
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - >-
        The project says that detailed validation and reference comparisons are kept outside the repository; the
        results are not published.
    note: >-
      Uses the standard's 20 ms grid and nominal calibration factor, where SQAT uses a slightly adjusted calibration.
  - method: tonality-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [tonality_ecma, ecma_tonal_analysis]
    scope: mono or stereo
    status: available
    since: 0.2.0
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - >-
        The project says that detailed validation and reference comparisons are kept outside the repository; the
        results are not published.
