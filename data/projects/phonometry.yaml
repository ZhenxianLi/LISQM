id: phonometry
name: phonometry
repository: https://github.com/jmrplens/phonometry
docs: https://jmrplens.github.io/phonometry/
languages: [Python]
kind: library
language_note: >-
  Pure Python; needs only NumPy and SciPy.
standing: newly-released
standing_note: Its psychoacoustics module was first released in July 2026 (version 3.1.0).
license: MIT
packages:
  - registry: pypi
    name: phonometry
install: pip install phonometry
maintainers: [José M. Requena Plens]
summary: >-
  Python acoustics library (formerly PyOctaveBand) that added a large psychoacoustics module in July 2026:
  ISO 532-1, -2 and -3 loudness, ECMA-418-2:2025 loudness, tonality, roughness and fluctuation strength
  (monaural), DIN 45692 sharpness, Osses fluctuation strength, ECMA-418-1:2024 TNR/PR, tonal audibility,
  impulsiveness, EPNL and ISO 226:2023. Only NumPy and SciPy are required.
ai_assistance: disclosed
ai_note: >-
  The draft paper (`paper/paper.md`) has an AI usage disclosure: language models drafted code, tests and
  documentation from the author's clause-by-clause readings, under the author's direction and review. 34
  commits from July 2026 contain Claude Code session links.
notes:
  - Renamed from PyOctaveBand (octave-band filtering) at 3.0.0 on 2026-07-06; the psychoacoustics module arrived in 3.1.0 on 2026-07-13. 873 of its 905 commits are from 2026.
  - The README reports 1793 of 1793 conformance checks passing across 519 standards, generated by the project's own CI ([CONFORMANCE.md](https://github.com/jmrplens/phonometry/blob/main/docs/CONFORMANCE.md)).
  - Keeps a public errata list of misprints found in standards, including ECMA-418-1:2024 and ECMA-418-2:2025 ([ERRATA.md](https://github.com/jmrplens/phonometry/blob/main/docs/ERRATA.md)).
  - A JOSS-format paper draft exists in the repository; no published paper yet. Version 4.0 (release candidate since 2026-09-10) moves modules.
  - Not implemented: Daniel & Weber roughness, Aures tonality, More and Di annoyance, and binaural combination for ECMA-418-2.
caveats:
  - Very new (psychoacoustics module first released in July 2026) and not yet widely used in the community; no independent verification has been published.
  - Single maintainer; all validation comes from the project's own tests.
  - The ECMA-418-2 checks only use the calibration signals, and no comparison with another implementation is reported. Its loudness reads 0.984 sone_HMS at the calibration point, which its own documentation says is outside the adjustment the standard allows.
  - Requires Python 3.13 or newer.
implements:
  - method: loudness-zwicker
    reference: iso-532-1-2017
    functions: [loudness_zwicker, loudness_zwicker_from_spectrum]
    scope: stationary and time-varying
    status: available
    since: 3.1.0
    validation: standard-data
    note: Written from the Annex A reference program; Annex B test signals are used in the tests.
  - method: loudness-moore-glasberg
    reference: iso-532-2-2017
    functions: [loudness_moore_glasberg, loudness_moore_glasberg_from_spectrum, loudness_moore_glasberg_from_third_octave]
    scope: with binaural inhibition
    status: available
    since: 3.1.0
    validation: standard-data
    note: The documentation says it reproduces the Annex B tone and broadband cases to within a percent or two.
  - method: loudness-moore-glasberg-time-varying
    reference: iso-532-3-2023
    functions: [loudness_moore_glasberg_time]
    status: available
    since: 3.1.0
    validation: standard-data
    note: >-
      Documented deviations: it runs at the native sample rate instead of resampling to 32 kHz, and the Annex B
      WAV-file cases are not reproduced (Annex C values are used instead).
  - method: loudness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [loudness_ecma]
    scope: mono only
    status: available
    since: 3.1.0
    validation: standard-data
    note: Checked at the calibration signal only, where it gives 0.9843 sone_HMS (−1.55 %).
  - method: tonality-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [tonality_ecma]
    scope: mono only
    status: available
    since: 3.1.0
    validation: standard-data
    note: Checked at the calibration signal only.
  - method: roughness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [roughness_ecma]
    scope: mono only; no entropy weighting
    status: available
    since: 3.1.0
    validation: standard-data
    note: Checked at the calibration signal only.
  - method: fluctuation-strength-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [fluctuation_strength_ecma]
    scope: mono only
    status: available
    since: 3.3.0
    validation: standard-data
    note: Checked at the calibration signal only (0.993 vacil_HMS); misprints found in Clause 9 are listed in its errata.
  - method: sharpness
    reference: din-45692-2009
    functions: [sharpness_din, sharpness_din_from_specific]
    scope: also the informative Aures and von Bismarck variants
    status: available
    since: 3.1.0
    validation: standard-data
    note: Checked with the DIN 45692 reference signal and Tables A.2 and A.3.
  - method: fluctuation-strength-osses
    reference: osses-2016
    functions: [fluctuation_strength]
    status: available
    since: 3.1.0
    validation: standard-data
    note: >-
      Compared with Table 1 of Osses et al. (2016) and with SQAT (correlation 0.98). Validated for amplitude
      modulation only; a steady 1 kHz tone reads about 0.09 vacil.
  - method: fluctuation-strength-osses
    reference: fastl-zwicker-2007
    functions: [fluctuation_strength_am_noise]
    scope: closed-form expression for amplitude-modulated noise
    status: available
    since: 3.1.0
    validation: standard-data
    note: A conformance row checks Eq. (10.2) of Fastl & Zwicker for amplitude-modulated broadband noise.
  - method: psychoacoustic-annoyance
    reference: zwicker-fastl-1999
    functions: [psychoacoustic_annoyance, psychoacoustic_annoyance_from_signal]
    status: available
    since: 3.1.0
    validation: standard-data
    note: Follows Eqs. 16.2–16.4 of Fastl & Zwicker (2007), the textbook form of Widmann's model.
  - method: tone-to-noise-prominence-ratio
    reference: ecma-418-1-ed3
    functions: [tone_to_noise_ratio, prominence_ratio, assess_tones]
    status: available
    since: 3.1.0
    validation: standard-data
    note: The "prominent" flag applies the numeric criterion only.
  - method: tonal-audibility-iso-20065
    reference: iso-pas-20065-2016
    functions: [tone_audibility, analyze_spectrum, audibility_from_levels, mean_audibility, audibility_uncertainty]
    status: available
    since: 3.1.0
    validation: standard-data
    note: >-
      Follows the 2016 PAS, not the 2022 TS. Does not apply the A-weighting required by clause 5.3.2.
      Reproduces the Annex E worked example; parts are checked against DIN 45681:2005 and its Annex J reference
      program (DIN 45681 itself is not implemented).
  - method: equal-loudness-contours
    reference: iso-226-2023
    functions: [equal_loudness_contour, equal_loudness_contours, loudness_level, hearing_threshold]
    status: available
    since: 3.1.0
    validation: standard-data
  - method: tonal-audibility-iso-1996-2
    reference: iso-1996-2-2007
    scope: Annex C; in the `phonometry.environment` namespace
    status: available
    validation: not-stated
  - method: tonal-audibility-iso-1996-2
    reference: iso-1996-2-2017
    scope: Annex K survey method and Table J.1; in the `phonometry.environment` namespace
    status: available
    validation: not-stated
  - method: tonal-audibility-iec-61400-11
    reference: iec-61400-11-2012
    functions: [wind_turbine_tonality]
    status: available
    validation: not-stated
  - method: impulsiveness
    reference: nt-acou-112-2002
    scope: in the `phonometry.environment` namespace
    status: available
    validation: not-stated
  - method: impulsiveness
    reference: iso-pas-1996-3-2022
    scope: in the `phonometry.environment` namespace
    status: available
    validation: not-stated
  - method: epnl
    reference: icao-annex-16-vol-1
    scope: PNL, PNLT and EPNL, in the `phonometry.aircraft` namespace
    status: available
    validation: standard-data
    note: Tested with the EPNL example of ICAO Doc 9501 (Environmental Technical Manual).
