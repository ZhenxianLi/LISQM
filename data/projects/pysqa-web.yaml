id: pysqa-web
name: PySQA Web
repository: https://github.com/henriquealende/PySQA-web
languages: [Python]
kind: application
language_note: >-
  A web application: a Python (FastAPI) server computes the metrics and a React/TypeScript interface runs in the
  browser. It runs locally with two start scripts (Python 3.10 and Node.js 18 or newer); the README also describes
  a hosted deployment on Render. No programming is needed to use it.
standing: newly-released
standing_note: Its repository starts on 2026-06-25; there are no releases or tags.
license: AGPL-3.0-only
license_note: >-
  The README names the GNU Affero General Public License v3.0, without "or later"; the licence was added on
  2026-10-24. The files in `backend/psychoacoustics/ecma_fast/` are modified copies of sottek-hearing-model code
  and say so in their headers.
maintainers: [Henrique Alende da Silveira]
summary: >-
  Web application for sound quality analysis, the web version of the author's PySQA: waveform, spectrum and
  spectrogram views, filtering, recording, frequency response functions and listening-test stimuli. Its Zwicker
  loudness, DIN 45692 sharpness and Daniel & Weber roughness come from MoSQITo; its ECMA-418-2 loudness, roughness
  and tonality come from sottek-hearing-model, partly through modified copies of that package's code.
ai_assistance: disclosed
ai_note: >-
  The repository contains a `CLAUDE.md` file ("Project Memory") for Claude Code, and `dev-tests/README.md`
  mentions the Edit tool.
notes:
  - "`backend/requirements.txt` asks for `mosqito>=1.2.1` and pins `sottek-hearing-model==0.1.13`."
  - >-
    It also computes a fluctuation strength that its code describes as "after Zwicker & Fastl (1999)", with a
    modulation index, an excitation weighting and a calibration constant of its own (1 kHz tone, 100 % AM at 4 Hz,
    60 dB gives 1 vacil). It is not listed here as an implementation of a named model.
  - >-
    The IPM (Impulsive Prominence Metric) is, as the README says, original work from the author's doctoral thesis
    (UFSC, 2024); it is not one of the metrics this list tracks.
  - >-
    The README lists two annoyance indices ("SIL" and Zwicker–Fastl) combined in the Batch panel from the other
    metrics; they were not checked for this entry.
  - The same author's desktop application PsychoBox is also listed.
caveats:
  - >-
    The README reports memory limits on the hosted server: on its 2 GiB plan, ECMA-418-2 roughness and tonality
    accept only about 2.5–3 s of audio, and longer files have to be analysed in sections. Running it locally lifts
    these limits.
implements:
  - metric: loudness-zwicker
    reference: iso-532-1-2017
    functions: [Loudness.loudnessZWK]
    scope: stationary and time-varying
    status: available
    via: mosqito
    validation: not-stated
    note: >-
      Calls `loudness_zwst` and `loudness_zwtv` of MoSQITo; the overall value is the stationary loudness, and the
      time-varying curve is computed after resampling to 48 kHz.
  - metric: sharpness
    reference: din-45692-2009
    functions: [Sharpnes_DIN.sharpnessCalculation]
    status: available
    via: mosqito
    validation: not-stated
    note: Calls `sharpness_din_st` of MoSQITo with the DIN weighting.
  - metric: roughness-daniel-weber
    reference: daniel-weber-1997
    functions: [Roughness.roughnessDW]
    status: available
    via: mosqito
    validation: not-stated
    conventions:
      - >-
        The overall value is the 90th percentile of MoSQITo's time-dependent roughness (`roughness_dw` with no
        overlap), which the code says matches commercial software; the specific roughness averages only the frames
        above the median.
    note: Calls `roughness_dw` of MoSQITo.
  - metric: loudness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [Loudness.loudnessECMA]
    scope: one channel, Clause 8 loudness
    status: available
    derived_from: [sottek-hearing-model]
    uses: [sottek-hearing-model]
    validation: cross-implementation
    validation_scope: outcome not stated
    compared_with: [sottek-hearing-model]
    validation_details:
      - >-
        `dev-tests/bench_ecma.py` records a reference from the installed sottek-hearing-model package and compares a
        candidate with it (relative difference, time and peak memory); the references are not committed.
    note: >-
      `ecma_fast/loudness_exact.py` takes the tonal and noise loudness from the modified tonality code below and
      finishes with the package's own `shm_loudness_ecma_from_comp`; if it fails, the package's `shm_loudness_ecma`
      is called instead.
  - metric: tonality-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [TonalityECMA.tonalityECMA_Shm]
    scope: one channel
    status: available
    derived_from: [sottek-hearing-model]
    uses: [sottek-hearing-model]
    validation: cross-implementation
    validation_scope: same as its source to about 1e-6 (README)
    compared_with: [sottek-hearing-model]
    validation_details:
      - >-
        The README states that `ecma_fast/tonality_exact.py`, a reorganised copy of the package's function, gives the
        same results to about 1e-6 with about a sixth of the memory and a third of the time, checked with
        `dev-tests/bench_ecma.py`.
    conventions:
      - >-
        A "Tonality precision" setting offers an approximate fast mode; the README gives the overall tonality within
        0.2 % and the tonal frequency within about 1 Hz. Exact is the default.
    note: >-
      Still calls helper functions of sottek-hearing-model; if the copy fails, the package's `shm_tonality_ecma`
      is called instead.
  - metric: roughness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [Roughness.roughnessECMA_Shm]
    scope: one channel
    status: available
    via: sottek-hearing-model
    validation: not-stated
    note: Calls `shm_roughness_ecma` of sottek-hearing-model 0.1.13; the overall value is its `roughness90pc`.
