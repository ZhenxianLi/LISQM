id: sqat
name: SQAT
repository: https://github.com/ggrecow/SQAT
docs: https://github.com/ggrecow/SQAT#readme
languages: [MATLAB]
kind: library
language_note: >-
  MATLAB only; SQAT has no Python interface of its own. pySQAT is a Python port of it, and MetaSona ports
  parts of it to C. Since v2.0 a graphical interface, `SQAT_GUI.m`, runs the metrics without programming, still
  inside MATLAB.
standing: established
super_project: 1  # bold and first in every list (see data/SCHEMA.md)
highlight: widely used
license: GPL-3.0-or-later
license_note: >-
  Since v2.0 (2026-10-15) the releases, like the default branch since 2026-09-15, are GPL-3.0-or-later, with
  BSD-3-Clause (ISO 532-1 loudness), MIT (Daniel & Weber roughness and nine utilities) and CC0-1.0 (colour maps)
  exceptions. Every release up to and including v1.3 is CC-BY-NC-4.0 (non-commercial) at repository level, while
  21 metric files in v1.3 carry BSD-style notices and the ECMA-418-2 files say GPL-3.0.
maintainers: [Gil Felix Greco, Roberto Merino-Martínez, Alejandro Osses, Mike Lotinga]
summary: >-
  MATLAB toolbox for sound quality analysis that bundles most psychoacoustic metrics in one place: ISO 532-1
  and ECMA-418-2 loudness, DIN 45692 sharpness, Daniel & Weber and ECMA-418-2 roughness, Osses fluctuation
  strength, Aures and ECMA-418-2 tonality, three psychoacoustic annoyance models (Widmann's, which SQAT also
  offers under its common attribution to Zwicker & Fastl; More; Di et al.) and EPNL. Every metric except the
  annoyance models has its own verification routine. Since v2.0 it also has a graphical interface.
ai_assistance: disclosed
ai_note: >-
  At v2.0, header comments in 44 files (24 of them in the graphical interface) say that changes or code written
  from August to October 2026 were assisted by Claude (Anthropic) and verified by the authors; 132 commits carry
  AI co-author trailers. Neither the README nor the v2.0 release notes have an AI statement.
paper:
  citation: >-
    Felix Greco, G., Merino-Martínez, R., Osses, A., & Langer, S. C. (2023). SQAT: a MATLAB-based toolbox for
    quantitative sound quality analysis. *Proceedings of INTER-NOISE 2023*, Chiba, Japan.
  doi: 10.3397/IN_2023_1075
notes:
  - The README lists 61 studies and theses that use SQAT.
  - >-
    v2.0 (2026-10-15) came about 330 commits after v1.3 (2025-04-04); its release notes mark the changes to the
    sound level meter, ISO 532-1 loudness, Daniel & Weber roughness, Aures tonality and the annoyance models as not
    backward compatible. Most of the metric-correctness work of August–September 2026, and the graphical
    interface, came from an external contributor through about 20 pull requests.
  - >-
    The ECMA-418-2 functions come from the RefMap MATLAB code by Lotinga and Torjussen (University of Salford); the
    ISO 532-1 loudness was adapted in 2023 from Ella Manor's 2015 MATLAB code for AARAE.
  - >-
    v2.0 adds a graphical interface, `SQAT_GUI.m` ([#84](https://github.com/ggrecow/SQAT/pull/84)). It loads
    calibrated .wav files, plays them with waveform and spectrogram, runs the sound level meter and any SQAT metric,
    compares files in a table of single values and exports the results. The README says every value comes from
    the SQAT functions, so the interface gives the same results as the code; it recommends the interface for a few
    files and the functions for many. The header of `SQAT_GUI.m` says that it is laid out as the interface of
    pySQAT.
  - "Open pull request: [#78](https://github.com/ggrecow/SQAT/pull/78) (ECMA-418-2 fluctuation strength)."
conventions:
  - text: >-
      Statistics such as N5 take the nearest rank of the sorted time series, without interpolation
      (`get_exceeded_value`), and leave out the first `time_skip` seconds of the signal.
    metrics: [loudness-zwicker, sharpness, roughness-daniel-weber, fluctuation-strength-osses, tonality-aures,
              psychoacoustic-annoyance]
  - text: >-
      Statistics take the nearest rank of the sorted time series, without interpolation (`get_exceeded_value`), and
      leave out the first `time_skip` seconds; the code enforces at least 304 ms (it cites ECMA-418-2:2025,
      Section 8.1.4).
    metrics: [loudness-ecma-418-2, tonality-ecma-418-2]
  - text: >-
      The single value is the 90th percentile from MATLAB's `prctile`, which interpolates; the other statistics take
      the nearest rank (`get_exceeded_value`). The first `time_skip` seconds are left out; the code enforces at least
      320 ms (it cites ECMA-418-2:2025, Section 7.1.8).
    metrics: [roughness-ecma-418-2]
caveats:
  - Releases up to and including v1.3 are licensed for non-commercial use only; v2.0 is under the GPL.
  - >-
    v2.0 is not backward compatible with v1.x. It corrects six deviations in ISO 532-1 time-varying loudness
    ([#48](https://github.com/ggrecow/SQAT/pull/48); test signal 10 deviated by 18.14 % in v1.3) and eight defects
    in Aures tonality ([#67](https://github.com/ggrecow/SQAT/issues/67)), rewrites Daniel & Weber roughness
    ([#65](https://github.com/ggrecow/SQAT/pull/65)), corrects the time weighting of the sound level meter
    ([#51](https://github.com/ggrecow/SQAT/pull/51); tone bursts with a duty cycle of 0.02 were reported 17.6 dB
    too low up to v1.3) and makes the annoyance calculation faster ([#42](https://github.com/ggrecow/SQAT/pull/42)).
    Results from v1.x and v2.0 differ.
  - The README warns that `main` may contain changes that are not yet fully verified and recommends using a release.
implements:
  - metric: loudness-zwicker
    reference: iso-532-1-2017
    functions: [Loudness_ISO532_1, Loudness_ISO532_1_from_wavfile]
    scope: stationary and time-varying
    status: available
    since: v1.0
    validation: standard-data
    derived_from: [aarae]
    validation_details:
      - Checked with the 25 test signals of Annex B.2–B.5 against the standard's tolerances.
      - >-
        For v2.0, the validation notes say that the maximum loudness and N5 of the time-varying test signals are
        close to the reference values, apart from offsets in the N5 of test signals 12 and 13 that they trace to
        the standard's reference spreadsheet. In v1.3, test signal 10 deviated by 18.14 % (PR #48).
    note: >-
      v2.0 corrects the time-varying procedure (PR #48) and the `time_skip` handling of the stationary procedure;
      results differ from v1.x.
  - metric: sharpness
    reference: din-45692-2009
    functions: [Sharpness_DIN45692, Sharpness_DIN45692_from_loudness, Sharpness_DIN45692_from_wavfile]
    scope: DIN 45692 weighting, plus von Bismarck and Aures options
    status: available
    since: v1.0
    validation: standard-data
    validation_details:
      - Checked with the narrowband and broadband test signals of DIN 45692.
  - metric: roughness-daniel-weber
    reference: daniel-weber-1997
    functions: [Roughness_Daniel1997, Roughness_Daniel1997_from_wavfile]
    status: available
    since: v1.0
    validation: standard-data
    derived_from: [aarae]
    validation_details:
      - Checked against amplitude- and frequency-modulation dependences from the literature.
    note: >-
      The v1.x code is AARAE's `roughnessDW.m` (Dik Hermes's code), adapted and verified for SQAT in 2023. v2.0
      rewrites it (PR #65, 2026-09-08) with corrections from revised code that Dik Hermes sent to the SQAT team in
      2025: 63 of 119 validation values go up and 56 down (largest change 0.155 asper).
  - metric: fluctuation-strength-osses
    reference: osses-2016
    functions: [FluctuationStrength_Osses2016, FluctuationStrength_Osses2016_from_wavfile]
    status: available
    since: v1.0
    validation: standard-data
    derived_from: [fluctuation-strength-tue]
    derived_by_author: true
    validation_details:
      - Checked against amplitude- and frequency-modulation dependences from the literature.
    note: >-
      Alejandro Osses's `FluctuationStrength_TUe.m` (TU/e, 2014–2016), taken into SQAT in 2020 and modified there
      by Osses since 2023.
  - metric: tonality-aures
    reference: aures-1985-euphony
    functions: [Tonality_Aures1985, Tonality_Aures1985_from_wavfile]
    status: available
    since: v1.0
    validation: standard-data
    validation_details:
      - >-
        v2.0 has five validation scripts: a tone emerging from noise, compared with Fig. 1(a) of Hastings et al.
        (2003) (root mean square deviation 0.0129 t.u. over nine points); the extraction of tonal components and
        the level excess, compared with the intermediate values of an independent implementation (Zhang &
        Shrestha, 2003); the weightings of bandwidth and frequency, compared with Aures's Figs. 6 and 5; and the
        dependence on bandwidth, compared with Hastings's subjective data.
      - v1.3 is checked with one signal-to-noise comparison.
    note: >-
      v2.0 fixes eight defects (issue #67; for example, only one tonal component's level excess entered the
      result, and tones were removed from the wrong spectrum), so results differ from v1.x.
  - metric: psychoacoustic-annoyance
    reference: zwicker-fastl-1999
    functions: [PsychoacousticAnnoyance_Zwicker1999, PsychoacousticAnnoyance_Zwicker1999_from_percentile]
    status: available
    since: v1.0
    validation: not-stated
    note: >-
      Since v2.0 a wrapper of `PsychoacousticAnnoyance_Widmann1992`, which its header says will be removed in future
      releases.
  - metric: psychoacoustic-annoyance
    reference: widmann-1992
    functions: [PsychoacousticAnnoyance_Widmann1992, PsychoacousticAnnoyance_Widmann1992_from_percentile]
    status: available
    since: v2.0
    validation: not-stated
    note: >-
      Added in June 2025 (PR #32); the README describes it as the same model as the Zwicker & Fastl entry under its
      original attribution.
  - metric: psychoacoustic-annoyance
    reference: more-2010
    functions: [PsychoacousticAnnoyance_More2010, PsychoacousticAnnoyance_More2010_from_percentile]
    status: available
    since: v1.0
    validation: not-stated
    validation_details:
      - No verification routine (README).
  - metric: psychoacoustic-annoyance
    reference: di-2016
    functions: [PsychoacousticAnnoyance_Di2016, PsychoacousticAnnoyance_Di2016_from_percentile]
    status: available
    since: v1.0
    validation: not-stated
    validation_details:
      - No verification routine (README).
  - metric: epnl
    reference: cfr-14-part-36
    functions: [EPNL_FAR_Part36, get_PNL, get_PNLT, get_Duration_Correction]
    status: available
    since: v1.1
    validation: cross-implementation
    compared_with: ["published EPNL values (Rizzi et al., 2020)"]
    validation_details:
      - The README says that no reference implementation or test signals exist, so the verification is partial.
      - >-
        Perceived noisiness is checked at its definition (a third-octave band of noise at 1 kHz and 40 dB SPL gives 1
        noy), and the tone correction factor against Table 3.7 of ICAO Doc 9501.
      - >-
        EPNL is cross-checked with Table 4 of Rizzi et al. (2020), AIAA 2020-2582, for 15 flyover sounds (five cases
        auralised by three tools): the largest difference is about 0.6 EPNdB.
    note: Follows Amendment 36-26 (2005).
  - metric: loudness-ecma-418-2
    reference: ecma-418-2-ed3
    functions: [Loudness_ECMA418_2, LoudnessFromComp_ECMA418_2]
    scope: mono or two channels with binaural combination
    status: available
    since: v1.3
    validation: cross-implementation
    derived_from: [refmap-psychoacoustics]
    derived_by_author: true
    compared_with: ["ArtemiS SUITE (HEAD acoustics)"]
    validation_details:
      - >-
        Checked against the ISO 226:2003 equal-loudness contours and against reference results from HEAD acoustics
        ArtemiS SUITE 15.7 (named in the source of SQAT's validation page) for a binaural recording of a train station.
    note: In v1.3; v2.0 follows the 4th edition.
  - metric: loudness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [Loudness_ECMA418_2, LoudnessFromComp_ECMA418_2]
    status: available
    since: v2.0
    validation: cross-implementation
    derived_from: [refmap-psychoacoustics]
    derived_by_author: true
    compared_with: ["ArtemiS SUITE (HEAD acoustics)"]
    validation_details:
      - >-
        Checked for the 4th edition against the ISO 226:2003 equal-loudness contours and against reference results from
        HEAD acoustics ArtemiS SUITE 17.1 (named in the source of SQAT's validation page) for a binaural recording of a
        train station (last checked in November 2025).
    note: Updated to the 4th edition in 2025.
  - metric: roughness-ecma-418-2
    reference: ecma-418-2-ed3
    functions: [Roughness_ECMA418_2]
    scope: with binaural combination
    status: available
    since: v1.3
    validation: cross-implementation
    derived_from: [refmap-psychoacoustics]
    derived_by_author: true
    compared_with: ["ArtemiS SUITE (HEAD acoustics)"]
    validation_details:
      - >-
        Checked for the dependence of the roughness of AM tones on modulation frequency, and against reference results
        from HEAD acoustics ArtemiS SUITE 15.7 (named in the source of SQAT's validation page) for a binaural recording
        of a train station.
    note: In v1.3; v2.0 follows the 4th edition.
  - metric: roughness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [Roughness_ECMA418_2]
    status: available
    since: v2.0
    validation: cross-implementation
    derived_from: [refmap-psychoacoustics]
    derived_by_author: true
    compared_with: ["ArtemiS SUITE (HEAD acoustics)"]
    validation_details:
      - >-
        Checked for the 4th edition for the dependence of the roughness of AM tones on modulation frequency, and against
        reference results from HEAD acoustics ArtemiS SUITE 17.1 (named in the source of SQAT's validation page) for a
        binaural recording of a train station.
    note: Amended to the 4th edition in November 2025.
  - metric: tonality-ecma-418-2
    reference: ecma-418-2-ed3
    functions: [Tonality_ECMA418_2]
    status: available
    since: v1.3
    validation: cross-implementation
    derived_from: [refmap-psychoacoustics]
    derived_by_author: true
    compared_with: ["ArtemiS SUITE (HEAD acoustics)"]
    validation_details:
      - >-
        Checked against reference results from HEAD acoustics ArtemiS SUITE 15.7 (named in the source of SQAT's
        validation page) for a binaural recording of a train station.
    note: In v1.3; v2.0 follows the 4th edition.
  - metric: tonality-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [Tonality_ECMA418_2]
    status: available
    since: v2.0
    validation: cross-implementation
    derived_from: [refmap-psychoacoustics]
    derived_by_author: true
    compared_with: ["ArtemiS SUITE (HEAD acoustics)"]
    validation_details:
      - >-
        Checked for the 4th edition against reference results from HEAD acoustics ArtemiS SUITE 17.1 (named in the
        source of SQAT's validation page) for a binaural recording of a train station.
      - >-
        A verification against Annex B.2 (PR #79) was merged and reverted on 2026-09-21 because the Annex B values of
        the 2025 edition appear to be out of date.
  - metric: fluctuation-strength-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [FluctuationStrength_ECMA418_2]
    status: proposed
    link: https://github.com/ggrecow/SQAT/pull/78
    validation: not-stated
    note: Open pull request since 2026-09-17.
cite:
  text: >-
    The README asks for the toolbox itself: Felix Greco, G., Merino-Martínez, R., Osses, A., & Lotinga, M. J. B.
    (2026). *SQAT: a sound quality analysis toolbox for MATLAB*. Zenodo. It recommends citing the specific version
    used, since results differ between releases; each release has its own DOI (for v2.0, `citation.cff` gives
    10.5281/zenodo.23387628). The paper above describes the first release.
  doi: 10.5281/zenodo.7934709
  cff: https://github.com/ggrecow/SQAT/blob/main/citation.cff
