id: rota-order
name: rota-order
full_name: "ROTA: Rotational Order Tracking and Analysis"
repository: https://github.com/ZhenxianLi/rota-order
docs: https://github.com/ZhenxianLi/rota-order#readme
languages: [Python]
kind: library
language_note: >-
  Python 3.10 or newer; depends only on NumPy and SciPy. The PyPI package is `rota-order`, imported as `rota`. The
  wrappers of version 0.6.0 call MoSQITo or sottek-hearing-model in Python, and SQAT in a local MATLAB through the
  MATLAB Engine API for Python; all three are optional and installed by the user.
standing: newly-released
standing_note: First released in October 2026; the README calls it pre-alpha.
license: GPL-3.0-or-later
packages:
  - registry: pypi
    name: rota-order
install: pip install rota-order
maintainers: [Zhenxian LI]
summary: >-
  Order analysis of noise and vibration from rotating machinery such as engines, electric motors and gearboxes. It
  finds the shaft speed from a tachometer or from the signal itself, resamples signals to the shaft angle, draws
  Campbell and order maps, extracts and removes orders with a Vold-Kalman filter, and resynthesises sound from order
  tables. On top of this it computes the ECMA-418-1:2024 tone-to-noise ratio and prominence ratio of machine orders
  along a run-up. Version 0.6.0 adds wrappers that compute loudness, sharpness, roughness and tonality with
  MoSQITo, sottek-hearing-model or SQAT and bin the results along rpm.
ai_assistance: disclosed
ai_note: The README says that Claude (Anthropic) was used as an assistant during development.
notes:
  - >-
    The order analysis follows the published literature cited in each docstring and is tested on synthetic signals
    with known speed, angle and order amplitudes; the README gives the tolerances, for example 0.2 dB for order
    amplitudes on stationary segments.
  - >-
    Version 0.6.0 is on the default branch, and the README and `CITATION.cff` name it as the current release, but it
    has no tag and is not on PyPI yet, whose latest version is 0.5.0. Its wrappers are therefore listed as unreleased.
  - >-
    The README places the psychoacoustic metrics themselves (loudness, sharpness, roughness, tonality) outside the
    project's scope. The wrappers of `rota.bridges` call the public functions of the toolboxes at run time, never copy
    their code, and state each toolbox's licence and how its authors ask to be cited.
  - The repository was renamed from ROTA to rota-order in October 2026; the old address redirects.
conventions:
  - text: >-
      `rota.bridges.along_rpm` bins a time-varying result along rpm after leaving out the start of the signal: in each
      speed bin it takes the 95th percentile of the loudness (N5), the median of the sharpness and the 90th percentile
      of the roughness, after 0.6 s for loudness and sharpness and 1.5 s for roughness.
    metrics: [loudness-zwicker, sharpness, roughness-daniel-weber]
  - text: >-
      `rota.bridges.along_rpm` takes the mean of the ECMA-418-2 loudness and tonality in each speed bin, tonality only
      above 0.02 tu_HMS, and the 90th percentile of the roughness, after about 0.3 s (0.6 s for SQAT's tonality).
    metrics: [loudness-ecma-418-2, tonality-ecma-418-2, roughness-ecma-418-2]
  - Input in any unit is turned into sound pressure in Pa by an explicit calibration factor and resampled to 48 kHz.
caveats:
  - Very new (first released in October 2026) and not yet seen to be widely used in the community; no independent verification has been published.
  - The README calls the current version pre-alpha and says that functions and signatures may still change before 1.0.
  - The SQAT wrappers need a licensed local MATLAB with the Signal Processing Toolbox and a checkout of SQAT v2.0.
implements:
  - metric: tone-to-noise-prominence-ratio
    reference: ecma-418-1-ed3
    functions: [rota.tonal.tone_prominence, rota.tonal.order_prominence, rota.tonal.prominence_criterion]
    scope: tones in a power spectrum, and orders of a rotating machine along a run-up
    status: available
    since: 0.5.0
    validation: standard-data
    validation_scope: formula examples; no published TNR or PR value
    compared_with: [mosqito]
    validation_details:
      - >-
        Tests check worked examples printed in ECMA-418-1:2024: the critical bandwidth at 500 Hz and 1 kHz (Clause
        10), the band edges at 1 kHz (Clause 12.2) and the proximity spacing at 150 and 850 Hz (Clause 11.6). The
        criteria are checked at 100 Hz, 1 kHz and 5 kHz.
      - >-
        TNR and PR of tones at 140 Hz, 1 kHz and 3 kHz in white noise are compared with the values that the
        standard's formulas give for the known tone and noise powers, within 0.5 dB; on spectra built line by line
        they agree to within 1e-9 dB for TNR and 0.03 dB for PR. No TNR or PR value published in the standard is
        checked.
      - >-
        For an order in a synthetic run-up, `order_prominence` gives the TNR within 1 dB of the analytic value in
        every speed bin, with a mean error below 0.4 dB.
      - >-
        A test compares the TNR of tones at 130 Hz to 4 kHz in flat noise with MoSQITo's `tnr_ecma_st` and requires
        agreement within 1.5 dB. MoSQITo follows ECMA-74:2019, so the comparison crosses editions. The test runs
        only where MoSQITo is installed, which the project's continuous integration does not do.
    conventions:
      - >-
        `order_prominence` analyses orders on the order-tracked (angle-domain) spectrum, so that an order stays one
        spectral line in every frame of a run-up. The docstring and a test show that a fixed time window long enough
        for the resolution the standard asks for at low frequency spreads a fast-sweeping order over the band and
        biases its TNR low, by about 19 dB in the test case.
      - >-
        Where the text of the 3rd edition is inconsistent, the module notes how it is read: the secondary tone is
        added in Formulae (A.7) and (A.8), the tone spacing is |f_s − f_p|, 500 Hz takes arithmetic centring, the
        criteria cover 89.1 Hz to 11 200 Hz, and the misprints of Formulae (21) and (23) are resolved with their
        Annex B counterparts.
    note: >-
      The "prominent" flag applies the numeric criterion only; the aural check of audibility (Sections 11.8 and 12.8)
      is not assessed.
  - metric: loudness-zwicker
    reference: iso-532-1-2017
    functions: [rota.bridges.mosqito.loudness]
    scope: time-varying, through MoSQITo's loudness_zwtv
    status: unreleased
    via: mosqito
    validation: self-tests
    validation_details:
      - >-
        Tests, which run only where MoSQITo is installed, check that the wrapper returns what a direct call of
        MoSQITo gives on the same signal, that the calibration factor scales the loudness, and that `along_rpm`
        puts the values in the right speed bins.
  - metric: sharpness
    reference: din-45692-2009
    functions: [rota.bridges.mosqito.sharpness]
    scope: through MoSQITo's sharpness_din_from_loudness
    status: unreleased
    via: mosqito
    validation: self-tests
    validation_details:
      - >-
        Tests, which run only where MoSQITo is installed, check that the wrapper returns what a direct call of
        MoSQITo gives, also when the sharpness is computed from an earlier loudness result.
  - metric: roughness-daniel-weber
    reference: daniel-weber-1997
    functions: [rota.bridges.mosqito.roughness]
    scope: through MoSQITo's roughness_dw
    status: unreleased
    via: mosqito
    validation: self-tests
    validation_details:
      - Tests, which run only where MoSQITo is installed, check that the wrapper returns what a direct call of MoSQITo gives.
  - metric: tonality-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [rota.bridges.shm.tonality]
    scope: through sottek-hearing-model's shm_tonality_ecma
    status: unreleased
    via: sottek-hearing-model
    validation: self-tests
    validation_details:
      - >-
        Tests, which run only where sottek-hearing-model is installed, check that the wrappers return what direct
        calls of the package give, that one speed bin reproduces the package's single values, and that the dominant
        tonal frequency of a tone in noise maps to its order.
  - metric: loudness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [rota.bridges.shm.loudness]
    scope: through sottek-hearing-model's shm_loudness_ecma_from_comp
    status: unreleased
    via: sottek-hearing-model
    validation: self-tests
    validation_details:
      - Tests, which run only where sottek-hearing-model is installed, check that the wrapper returns what a direct call of the package gives.
  - metric: roughness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [rota.bridges.shm.roughness]
    scope: through sottek-hearing-model's shm_roughness_ecma
    status: unreleased
    via: sottek-hearing-model
    validation: self-tests
    validation_details:
      - Tests, which run only where sottek-hearing-model is installed, check that the wrapper returns what a direct call of the package gives.
  - metric: loudness-zwicker
    reference: iso-532-1-2017
    functions: [rota.bridges.sqat.loudness]
    scope: time-varying, through SQAT v2.0's Loudness_ISO532_1 in MATLAB
    status: unreleased
    via: sqat
    validation: self-tests
    validation_details:
      - >-
        Tests with a stub engine check the call passed to SQAT and the conversion of its output; the comparison with a
        direct SQAT call runs only where MATLAB and SQAT v2.0 are installed.
  - metric: sharpness
    reference: din-45692-2009
    functions: [rota.bridges.sqat.sharpness]
    scope: through SQAT v2.0's Sharpness_DIN45692_from_loudness in MATLAB
    status: unreleased
    via: sqat
    validation: self-tests
    validation_details:
      - >-
        Tests with a stub engine check the call passed to SQAT and the conversion of its output; the comparison with a
        direct SQAT call runs only where MATLAB and SQAT v2.0 are installed.
  - metric: roughness-daniel-weber
    reference: daniel-weber-1997
    functions: [rota.bridges.sqat.roughness]
    scope: through SQAT v2.0's Roughness_Daniel1997 in MATLAB
    status: unreleased
    via: sqat
    validation: self-tests
    validation_details:
      - >-
        Tests with a stub engine check the call passed to SQAT and the conversion of its output; the comparison with a
        direct SQAT call runs only where MATLAB and SQAT v2.0 are installed.
  - metric: tonality-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [rota.bridges.sqat.tonality]
    scope: through SQAT v2.0's Tonality_ECMA418_2 in MATLAB
    status: unreleased
    via: sqat
    validation: self-tests
    validation_details:
      - >-
        Tests with a stub engine check the call passed to SQAT and the conversion of its output; the comparison with a
        direct SQAT call runs only where MATLAB and SQAT v2.0 are installed.
