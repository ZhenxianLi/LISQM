id: torch-amt
name: torch_amt
repository: https://github.com/StefanoGiacomelli/torch_amt
docs: https://torch-amt.readthedocs.io/
languages: [Python]
kind: library
standing: new
standing_note: First released in February 2026.
license: GPL-3.0-or-later
packages:
  - registry: pypi
    name: torch-amt
install: pip install torch-amt
maintainers: [Stefano Giacomelli]
summary: >-
  PyTorch implementations of models from the MATLAB Auditory Modeling Toolbox (AMT), differentiable and able to
  run on GPU. For loudness it has the time-varying models of Glasberg & Moore (2002) and Moore et al. (2016,
  binaural).
ai_assistance: not-stated
notes:
  - The README asks users to cite both the software and the AMT paper (Majdak, Hollomey & Baumgartner, 2022).
  - >-
    The other models in the package (Dau1997, King2019, Osses2021, Paulick2024) are not psychoacoustic metrics in
    the sense of this index. There is no port of AMT's `moore1997`, `chen2011` or `bramslow2004`, and no
    roughness, sharpness or fluctuation strength.
caveats:
  - >-
    The documentation claims "Matching MATLAB AMT v1.6.0 implementations", but the tests contain no stored AMT or
    MATLAB reference outputs.
implements:
  - method: loudness-moore-glasberg-time-varying
    reference: glasberg-moore-2002
    functions: [torch_amt.models.Glasberg2002]
    scope: short-term and long-term loudness
    status: available
    validation: cross-implementation
    note: Ported from AMT `glasberg2002`; agreement with AMT is claimed in the documentation, without stored reference data.
  - method: loudness-moore-glasberg-time-varying
    reference: moore-2016
    functions: [torch_amt.models.Moore2016]
    scope: binaural
    status: available
    validation: cross-implementation
    note: >-
      Described as a "1:1 port" of AMT `moore2016`, with outer and middle ear per ANSI S3.4-2007 (docstring);
      agreement with AMT is claimed in the documentation, without stored reference data.
manual:
  last_commit: 2026-03-19
  latest_release: {version: 0.2.0, date: 2026-02-10}
  archived: false
sources:
  - https://github.com/StefanoGiacomelli/torch_amt
  - https://github.com/StefanoGiacomelli/torch_amt/blob/main/README.md
  - https://github.com/StefanoGiacomelli/torch_amt/blob/main/docs/source/index.rst
  - https://pypi.org/project/torch-amt/
checked: 2026-10-06
