id: js2251-iso532-3
name: iso532-3 (tv2018.m)
short_name: iso532-3
repository: https://github.com/js2251/iso532-3
docs: https://github.com/js2251/iso532-3/blob/main/readme%20TVL%202018.pdf
languages: [MATLAB]
kind: reference-program
standing: established
license: none
license_note: >-
  No licence file. The readme PDF says: "The code is provided free for any research purposes. For commercial use
  please contact Brian C. J. Moore."
maintainers: [Brian C. J. Moore, Brian R. Glasberg, Josef Schlittenlacher]
summary: >-
  MATLAB code by Brian C. J. Moore, Brian R. Glasberg and Josef Schlittenlacher (Cambridge Hearing Group) for the
  loudness of time-varying sounds: the model of Moore et al. (2016) with the revised time constants of Moore et
  al. (2018). Its readme calls `tv2018.m` "the reference Matlab code referred to in ISO 532-3".
ai_assistance: not-stated
notes:
  - >-
    There is no README.md; the documentation is the PDF "readme TVL 2018", which includes a worked example with
    the file 1k100ms.wav.
  - >-
    Takes a WAV file or a MATLAB variable with one or two channels and resamples it to 32 kHz. Outer- and
    middle-ear transfer functions for free-field, diffuse-field and eardrum presentation are included. Returns
    short-term and long-term loudness and the instantaneous loudness of each ear.
  - >-
    Also contains sone/phon conversion functions for the TV2015 and TV2018 tables (`Phon2SoneTV2015`,
    `Sone2PhonTV2015`, `Phon2SoneTV2018`, `Sone2PhonTV2018`).
  - The Python project LoudnessModel is a translation of the Cambridge MATLAB code for the same model.
  - >-
    An [archived copy](https://web.archive.org/web/20251123130736/https://www.psychol.cam.ac.uk/hearing) of the
    Cambridge Hearing Group's programs page (November 2025) offers the TVL 2018 MATLAB code as a ZIP file: 23 of its
    28 MATLAB files are identical to this repository, which adds the TV2018 conversion tables and the scripts for the
    standard's tables. The page itself now needs a University of Cambridge login.
caveats:
  - >-
    The code was last changed in October 2021, before ISO 532-3 was published (July 2023); the readme refers to
    "ISO 532-3 (2021)". Whether it is identical to the source code supplied with the published standard is not
    stated.
  - >-
    For its text-file output, `tv2018.m` converts sone to phon with `Sone2PhonTV2015`, although TV2018 conversion
    tables were added in October 2021.
  - The WAV files that the Annex B script reads are not in the repository, and no computed tables are stored.
implements:
  - metric: loudness-moore-glasberg-time-varying
    reference: iso-532-3-2023
    functions: [tv2018]
    scope: reference MATLAB code referred to in ISO 532-3, per its readme
    status: available
    validation: not-stated
    validation_details:
      - >-
        The folder "code for tables" has scripts that compute Table 5 (sone to phon) and the values of Annexes B and C
        (AnnexC.m is headed "Signals numbered as in ISO 532-2 Annex B"); the scripts do not name ISO 532-3.
    note: Written by the model's authors (per the readme PDF).
