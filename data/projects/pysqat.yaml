id: pysqat
name: pySQAT
repository: https://github.com/PALILA-TUDelft/pySQAT
languages: [Python]
kind: library
based_on: sqat
language_note: >-
  Python port of SQAT with a PySide6 interface; its ECMA-418-2 functions call sottek-hearing-model.
standing: developing
license: none
license_note: >-
  No licence file at the repository root. The bundled copy of SQAT v1.3 (MATLAB, used as the validation
  reference) carries SQAT's CC-BY-NC-4.0 licence.
maintainers: [Gerard Mendoza Ferrandis]
summary: >-
  Python port of the MATLAB toolbox SQAT (README title "SQAT4PY") with a PySide6 graphical interface. Covers
  ISO 532-1 loudness, DIN 45692 sharpness, Daniel & Weber roughness, Osses fluctuation strength, Aures tonality,
  three psychoacoustic annoyance models and EPNL; its ECMA-418-2 functions call sottek-hearing-model.
ai_assistance: not-stated
notes:
  - Developed since May 2025 under the PALILA-TUDelft GitHub organisation; no release or tag yet.
caveats:
  - Without a licence, reuse rights are unclear, and the bundled MATLAB code is licensed for non-commercial use only.
  - The ports follow SQAT v1.3 and do not include SQAT's 2026 fixes to ISO 532-1 time-varying loudness, Daniel & Weber roughness and Aures tonality.
implements:
  - metric: loudness-zwicker
    reference: iso-532-1-2017
    functions: [Loudness_ISO532_1]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
  - metric: sharpness
    reference: din-45692-2009
    functions: [Sharpness_DIN45692, Sharpness_DIN45692_from_loudness]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
  - metric: roughness-daniel-weber
    reference: daniel-weber-1997
    functions: [Roughness_Daniel1997]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
    note: Follows SQAT v1.3, before SQAT's September 2026 rewrite.
  - metric: fluctuation-strength-osses
    reference: osses-2016
    functions: [FluctuationStrength_Osses2016]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
  - metric: tonality-aures
    reference: aures-1985-euphony
    functions: [Tonality_Aures1985]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
    note: A June 2026 commit corrected its calibration; it predates SQAT's September 2026 fixes.
  - metric: psychoacoustic-annoyance
    reference: zwicker-fastl-1999
    functions: [PsychoacousticAnnoyance_Zwicker1999]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
  - metric: psychoacoustic-annoyance
    reference: more-2010
    functions: [PsychoacousticAnnoyance_More2010]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
  - metric: psychoacoustic-annoyance
    reference: di-2016
    functions: [PsychoacousticAnnoyance_Di2016]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
  - metric: epnl
    reference: cfr-14-part-36
    functions: [EPNL_FAR_Part36]
    status: available
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - Compared with SQAT v1.3, run in MATLAB, by `validation/FINAL_VAL.py`; the generated reports are not committed.
  - metric: loudness-ecma-418-2
    reference: ecma-418-2-ed4
    functions: [Loudness_ECMA418_2]
    status: available
    via: sottek-hearing-model
    validation: cross-implementation
    compared_with: [sqat]
    validation_details:
      - >-
        Compared by `validation/FINAL_VAL.py` with the bundled SQAT v1.3 MATLAB code, which follows ECMA-418-2:2024
        (3rd edition), so the comparison crosses editions.
  - metric: roughness-ecma-418-2
