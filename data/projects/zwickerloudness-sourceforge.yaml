id: zwickerloudness-sourceforge
name: "Zwicker's Loudness Calculation SW + Tool (ISO 532B)"
short_name: zwickerloudness
repository: https://sourceforge.net/projects/zwickerloudness/
languages: [C]
kind: application
language_note: >-
  C console program for BSD, Linux and Windows that reads one-third-octave band levels from files.
standing: developing
license: GPL-2.0
license_note: >-
  SourceForge lists "GNU General Public License version 2.0", but the `license` file in the release archive
  (loudness-020) has the author's own BSD-style terms, with a fourth clause: a significantly different project that
  reuses parts of the code must be open source as well and must reference the original code.
maintainers: [V. Portet]
summary: >-
  Console program in C, for BSD, Linux and Windows, that calculates the loudness of stationary sounds with
  Zwicker's method (ISO 532B / DIN 45631) from one-third-octave band levels. A companion tool analyses WAV
  files to produce those input files.
ai_assistance: not-stated
notes:
  - >-
    Partly ported from the BASIC "Program for calculating loudness according to DIN 45631 (ISO 532B)",
    published in the Journal of the Acoustical Society of Japan in 1991, as obtained from Osaka University's
    website.
  - >-
    Distributed as release archives on SourceForge, from release 010 (2010-04-15) to zwickerloudness-020
    (2011-07-01). The last-commit date given here (2018-06-05) is the project's "Last Update" date on
    SourceForge, not a commit date.
caveats:
  - Stationary sounds only; there is no procedure for time-varying sounds.
implements:
  - method: loudness-zwicker
    reference: din-45631-1991
    scope: stationary, from one-third-octave band levels
    status: available
    validation: self-tests
    derived_from: ["BASIC program of DIN 45631 (Zwicker et al., 1991)"]
    validation_details:
      - >-
        The documentation in the release archive says that tests with "classical cases", such as the included test
        WAV files, "seems to give correct results", and invites users to compare the output with that of the
        original BASIC program.
    note: >-
      Port of the 1991 BASIC program "according to DIN 45631 (ISO 532B)", the program that accompanies
      DIN 45631:1991; the same program is the basis of deeuu/loudness.
manual:
  last_commit: 2018-06-05
  latest_release: {version: zwickerloudness-020, date: 2011-07-01}
sources:
  - https://sourceforge.net/projects/zwickerloudness/
  - https://sourceforge.net/projects/zwickerloudness/files/
  - https://sourceforge.net/projects/zwickerloudness/files/README.TXT/download
  - https://sourceforge.net/projects/zwickerloudness/files/zwickerloudness-020/loudness-020.tar.gz/download
checked: 2026-10-08
