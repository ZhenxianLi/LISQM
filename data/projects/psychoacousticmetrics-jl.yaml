id: psychoacousticmetrics-jl
name: PsychoacousticMetrics.jl
repository: https://github.com/slink/PsychoacousticMetrics.jl
languages: [Julia]
kind: library
language_note: >-
  Builds on ZwickerLoudness.jl by the same author: sharpness takes its loudness result, and the time-varying
  annoyance takes the output of ZwickerLoudnessAudio.jl's `loudness_zwtv`. Roughness and fluctuation strength take
  audio.
standing: newly-released
standing_note: First registered in July 2026.
license: MIT
license_note: >-
  Test data, the roughness implementation and several weighting tables are derived from MoSQITo (Apache-2.0);
  fluctuation-strength tables and annoyance constants reference SQAT (CC BY-NC 4.0) as factual data, without
  reusing its code (README, `test/data/NOTICE`).
packages:
  - registry: julia
    name: PsychoacousticMetrics
install: 'using Pkg; Pkg.add("PsychoacousticMetrics")'
maintainers: [slink]
summary: >-
  Julia package for the Zwicker family of sound-quality metrics on top of ZwickerLoudness.jl: DIN 45692:2009
  sharpness (with Aures, von Bismarck and Fastl weightings), Daniel & Weber roughness, Osses et al. (2016)
  fluctuation strength and Widmann (1992) psychoacoustic annoyance.
ai_assistance: not-stated
notes:
  - >-
    Roughness follows MoSQITo's `roughness_dw` ("as implemented by MoSQITo"), not Daniel and Weber's original
    code.
  - >-
    Fluctuation strength needs audio at 44.1 or 48 kHz; the time-varying (percentile) annoyance needs 48 kHz.
  - >-
    Annoyance comes in two forms: the canonical percentile convention (N5, S5, R5 and FS5 from time-varying
    tracks, since 0.5.0) and a documented stationary approximation from whole-signal values (since 0.4.0).
caveats:
  - >-
    Percentiles are Hyndman–Fan type 7 quantiles; SQAT uses nearest-rank selection, which the README says differs
    by a full order-statistic step on the coarse fluctuation-strength track.
implements:
  - method: sharpness
    reference: din-45692-2009
    functions: [sharpness]
    scope: "weightings: DIN 45692 (default), Aures, von Bismarck, Fastl; from a ZwickerLoudness.jl result"
    status: available
    since: 0.2.0
    validation: standard-data
    note: >-
      Tested against all 41 reference signals of DIN 45692:2009 chapter 6 (21 narrowband, 20 broadband) within the
      standard's tolerance of ±max(5 %, 0.05 acum), and cross-checked against MoSQITo for all four weightings.
  - method: roughness-daniel-weber
    reference: daniel-weber-1997
    functions: [roughness_dw]
    status: available
    since: 0.2.0
    validation: standard-data
    note: >-
      Tested against the Zwicker & Fastl reference curves on MoSQITo's validation grid (±0.1 asper) and
      cross-checked against MoSQITo's `roughness_dw`. Five points at a 2 kHz carrier miss the ±0.1 asper gate, as
      MoSQITo does, and are checked against MoSQITo instead.
  - method: fluctuation-strength-osses
    reference: osses-2016
    functions: [fluctuation_strength_osses]
    status: available
    since: 0.3.0
    validation: reference-code
    note: >-
      Cross-checked against SQAT's `FluctuationStrength_Osses2016` (run under Octave) on 26 cases, including the
      18 points of Fastl and Zwicker's reference grid, to a relative tolerance of 1e-6.
  - method: psychoacoustic-annoyance
    reference: widmann-1992
    functions: [psychoacoustic_annoyance_widmann]
    scope: percentile convention (N5, S5, R5, FS5) and a stationary approximation
    status: available
    since: 0.4.0
    validation: cross-implementation
    note: >-
      Cross-checked against SQAT's `PsychoacousticAnnoyance_Widmann1992` (an 840-case formula grid reproduced
      exactly, and six signal-level cases) and checked at the 1 au anchor (1 kHz tone at 40 dB SPL).
manual:
  last_commit: 2026-09-02
  latest_release: {version: 0.5.0, date: 2026-09-02}
  archived: false
sources:
  - https://github.com/slink/PsychoacousticMetrics.jl
  - https://github.com/slink/PsychoacousticMetrics.jl/blob/main/README.md
  - https://github.com/slink/PsychoacousticMetrics.jl/blob/main/test/data/NOTICE
  - https://github.com/slink/PsychoacousticMetrics.jl/blob/main/Project.toml
  - https://github.com/JuliaRegistries/General/tree/master/P/PsychoacousticMetrics
checked: 2026-10-07
