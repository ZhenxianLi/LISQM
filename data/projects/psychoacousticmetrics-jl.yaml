id: psychoacousticmetrics-jl
name: PsychoacousticMetrics.jl
repository: https://github.com/slink/PsychoacousticMetrics.jl
languages: [Julia]
kind: library
language_note: >-
  Builds on ZwickerLoudness.jl by the same author: sharpness takes its loudness result, and the time-varying
  annoyance takes the output of ZwickerLoudnessAudio.jl's `loudness_zwtv`. Roughness and fluctuation strength take
  audio.
standing: newly-released
standing_note: First registered in July 2026.
license: MIT
license_note: >-
  Test data, the roughness implementation and several weighting tables are derived from MoSQITo (Apache-2.0);
  fluctuation-strength tables and annoyance constants reference SQAT (CC BY-NC 4.0) as factual data, without
  reusing its code (README, `test/data/NOTICE`).
packages:
  - registry: julia
    name: PsychoacousticMetrics
install: 'using Pkg; Pkg.add("PsychoacousticMetrics")'
maintainers: [slink]
summary: >-
  Julia package for the Zwicker family of sound-quality metrics on top of ZwickerLoudness.jl: DIN 45692:2009
  sharpness (with Aures, von Bismarck and Fastl weightings), Daniel & Weber roughness, Osses et al. (2016)
  fluctuation strength and Widmann (1992) psychoacoustic annoyance.
ai_assistance: not-stated
notes:
  - >-
    Roughness follows MoSQITo's `roughness_dw` ("as implemented by MoSQITo"), not Daniel and Weber's original
    code.
  - >-
    Annoyance comes in two forms: the canonical percentile convention (N5, S5, R5 and FS5 from time-varying
    tracks, since 0.5.0) and a documented stationary approximation from whole-signal values (since 0.4.0).
implements:
  - metric: sharpness
    reference: din-45692-2009
    functions: [sharpness]
    scope: "weightings: DIN 45692 (default), Aures, von Bismarck, Fastl; from a ZwickerLoudness.jl result"
    status: available
    since: 0.2.0
    validation: standard-data
    compared_with: [mosqito]
    uses: [zwickerloudness-jl]
    validation_details:
      - >-
        Tested against all 41 reference signals of DIN 45692:2009 chapter 6 (21 narrowband, 20 broadband) within the
        standard's tolerance of ±max(5 %, 0.05 acum).
      - Cross-checked against MoSQITo for all four weightings.
      - >-
        Total loudness N is computed as the Riemann sum over the 240-bin specific loudness (`0.1 * sum`), not taken
        from `ZwickerResult.loudness` (see the `sharpness` docstring).
  - metric: roughness-daniel-weber
    reference: daniel-weber-1997
    functions: [roughness_dw]
    status: available
    since: 0.2.0
    validation: standard-data
    compared_with: [mosqito]
    derived_from: [mosqito]
    validation_details:
      - >-
        Tested against the Zwicker & Fastl reference curves on MoSQITo's validation grid (7 carrier × 11 modulation
        frequencies) within ±0.1 asper, and cross-checked against MoSQITo's `roughness_dw` on identical signals.
      - >-
        Five points at a 2 kHz carrier miss the ±0.1 asper gate. MoSQITo misses them by the same amount (and
        overshoots Daniel & Weber's own curve there by 15–31 %), so these five are checked for agreement with MoSQITo
        to 5e-3 asper instead.
      - >-
        Against the Daniel & Weber curves themselves, 63 of the 77 grid points are within 30 % of the reference
        (reported, not gated).
  - metric: fluctuation-strength-osses
    reference: osses-2016
    functions: [fluctuation_strength_osses]
    status: available
    since: 0.3.0
    validation: reference-code
    compared_with: [sqat]
    validation_details:
      - >-
        Cross-checked against SQAT's `FluctuationStrength_Osses2016`, run under Octave, on identical signals: 26
        cases, including all 18 points of Fastl & Zwicker's AM/FM reference grid (Osses 2018 thesis, Table B.1), each
        reproduced to a relative tolerance of 1e-6 (measured 3e-9).
      - >-
        The grid stimuli are synthesised following the Osses et al. (2016) validation files that SQAT's own validation
        reads; the tests also check that each synthetic stimulus gives the value SQAT gives on the real file (tones to
        5e-3, noise to 25 % across random draws).
      - >-
        Against the published curves, 11 of the 18 points are within 30 %, and exactly those 11 are gated. The other
        seven are misses of the reference model itself (FM tones with a modulation frequency above 4 Hz overestimated
        three- to fourfold, thesis §B.4.1; the shoulder and tail points of AM tones and noise), which SQAT's own
        validation figures also show.
    conventions:
      - Needs audio at 44.1 or 48 kHz (an error otherwise); SQAT resamples other rates itself.
  - metric: psychoacoustic-annoyance
    reference: widmann-1992
    functions: [psychoacoustic_annoyance_widmann]
    scope: percentile convention (N5, S5, R5, FS5) and a stationary approximation
    status: available
    since: 0.4.0
    validation: cross-implementation
    compared_with: [sqat]
    uses: [zwickerloudness-jl]
    validation_details:
      - >-
        Cross-checked against SQAT's `PsychoacousticAnnoyance_Widmann1992`: an 840-case formula grid, reproduced
        bit-exactly, and six signal-level cases with SQAT's own N5, S5, R5 and FS5 vendored, so that every deviation
        is attributed to a component.
      - >-
        Checked at the published 1 au anchor (a 1 kHz tone at 40 dB SPL): on the 4 s cross-check case, the percentile
        convention lands 0.1 % from it and the stationary approximation 0.8 %; on the README's 5 s examples, 0.3 % and
        1.4 %.
    conventions:
      - The percentile form needs 48 kHz input.
      - >-
        Percentiles are Hyndman–Fan type 7 quantiles (linear interpolation); SQAT takes the nearest rank, which the
        README says differs by a full order-statistic step on the coarse fluctuation-strength track.
cite:
  text: The README links a [Zenodo DOI](https://zenodo.org/badge/latestdoi/1292553110) for the latest version.
manual:
