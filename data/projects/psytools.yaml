claim: >-
  A conference paper describes an open-source Python toolbox for standardised psychoacoustic analysis: loudness,
  sharpness, fluctuation strength, roughness, tonality, psychoacoustic annoyance, LAeq and LAmax, following ISO
  532-1, DIN 45692 and ECMA-418, with the Zwicker model and the Sottek Hearing Model.
