name: Refresh

on:
  schedule:
    - cron: "17 5 1,15 * *" # 05:17 UTC on the 1st and the 15th of every month
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }} # GitHub API access for refresh.py and discover.py
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh repository and package metadata
        # metadata.md lists every change (it goes into the commit message and the run summary); refresh.md lists
        # only what a person has to act on (it goes into the review issue).
        run: |
          python scripts/refresh.py --report "$RUNNER_TEMP/metadata.md" --review "$RUNNER_TEMP/refresh.md"
          { echo "## Metadata changes"; echo; cat "$RUNNER_TEMP/metadata.md"; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: python scripts/build.py

      - name: Commit refreshed metadata
        run: |
          files="data/snapshot.json README.md CHANGELOG.md llms.txt llms-full.txt data/index.json"
          # Stage the files that changed (git add fails on a path that does not exist).
          git status --porcelain -z -- $files | cut -z -c4- | xargs -0 -r git add -A --
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          # Routine changes are committed without review; the message lists them.
          { echo "Refresh metadata: $(date -u +%F)"; echo; cat "$RUNNER_TEMP/metadata.md"; } > "$RUNNER_TEMP/message.txt"
          git commit -F "$RUNNER_TEMP/message.txt"
          git push || { git pull --rebase origin main && git push; }

      - name: Look for new candidates
        run: python scripts/discover.py --report "$RUNNER_TEMP/discover.md"

      - name: Watch standards
        run: python scripts/watch_standards.py --report "$RUNNER_TEMP/standards.md"

      - name: Check links
        # Broken links (404, 410, unknown host) are reported at once; other failures only when they repeat.
        run: python scripts/check_links.py --report "$RUNNER_TEMP/links.md"

      - name: Commit standards watch and link check state
        run: |
          git add data/standards-watch.json data/link-check.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Standards watch and link check: $(date -u +%F)"
          git push || { git pull --rebase origin main && git push; }

      - name: Make sure the issue labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Created once; existing labels (and any colours changed by hand) are left alone.
          gh label create review --color 0e8a16 --description "Automated review: what needs a person" 2>/dev/null || true
          gh label create new-project --color 1d76db --description "Suggests a project for the list" 2>/dev/null || true
          gh label create correction --color d93f0b --description "Corrects an entry in the list" 2>/dev/null || true
          gh label create standards --color 5319e7 --description "New or revised standard edition" 2>/dev/null || true

      - name: Update the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%F)
          body="$RUNNER_TEMP/issue.md"
          {
            echo "Automated review of $today ([workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo "## Repository and package metadata"
            echo
            echo "Routine changes (new commits, versions, releases) were committed without review."
            echo
            cat "$RUNNER_TEMP/refresh.md"
            echo
            echo "## New candidates"
            echo
            cat "$RUNNER_TEMP/discover.md"
            echo
            echo "## Standards"
            echo
            cat "$RUNNER_TEMP/standards.md"
            echo
            echo "## Links"
            echo
            cat "$RUNNER_TEMP/links.md"
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          # Each report is a single line when there is nothing for a person to do.
          findings=false
          for report in refresh discover standards links; do
            if [ "$(grep -c . "$RUNNER_TEMP/$report.md")" -gt 1 ]; then
              findings=true
            fi
          done
          if [ "$findings" = false ]; then
            echo "Nothing to review."
            exit 0
          fi

          number=$(gh issue list --label review --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "Review: $today" --body-file "$body"
            # Editing an issue notifies nobody; a comment does.
            gh issue comment "$number" --body "Updated with the review of $today."
          else
            gh issue create --title "Review: $today" --label review --body-file "$body"
          fi

  pages:
    needs: refresh
    uses: ./.github/workflows/pages.yml

  search-engines:
    needs: pages
    uses: ./.github/workflows/indexnow.yml
