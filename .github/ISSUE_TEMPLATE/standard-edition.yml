name: Standard edition
description: Report a new or revised standard, edition, amendment, draft stage or withdrawal.
title: "Standard: "
labels: ["standards"]
body:
  - type: markdown
    attributes:
      value: |
        The index lists implementations by the standard edition or model paper they follow, so it needs to
        know when a standard changes. A weekly job watches some catalogue pages, but not every standards body
        publishes pages it can read, so reports are welcome. The current list of editions is on the
        [Standards page](https://zhenxianli.github.io/psychoacoustic-metrics-index/standards.html).

  - type: input
    id: standard
    attributes:
      label: Standard and edition
      description: The designation as the standards body writes it.
      placeholder: e.g. ECMA-418-2 4th edition, ISO/CD 532-1, ISO 226:2023
    validations:
      required: true

  - type: dropdown
    id: change
    attributes:
      label: Type of change
      options:
        - New standard
        - New edition
        - Amendment or corrigendum
        - Draft stage (for example CD, DIS or FDIS)
        - Withdrawn, replaced or confirmed
        - Other
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Publication date
      description: As YYYY-MM-DD, YYYY-MM or YYYY. For a draft, the date it reached that stage. Leave empty if unknown.
      placeholder: e.g. 2025-06
    validations:
      required: false

  - type: textarea
    id: changes
    attributes:
      label: What changed
      description: >-
        What is new or different compared with the previous edition, as far as it is public: methods added or
        changed, corrected tables or constants, new test signals. Which metrics in the index does it affect?
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source
      description: The catalogue page of the standards body (ISO, IEC, DIN, Ecma, ANSI/ASA …) or another public source.
      placeholder: https://
    validations:
      required: true

  - type: textarea
    id: implementations
    attributes:
      label: Implementations that already follow it
      description: Optional. Projects that already implement the new edition, with links.
    validations:
      required: false
